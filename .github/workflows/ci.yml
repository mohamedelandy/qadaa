name: Qadaa CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  # Manual full-suite runs: Actions → Qadaa CI → Run workflow → suite: regression
  workflow_dispatch:
    inputs:
      suite:
        description: "Maestro suite to run on the iOS simulator"
        type: choice
        default: smoke
        options:
          - smoke
          - regression
  # Nightly full regression on the default branch.
  schedule:
    - cron: "0 2 * * *"

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Dependency audit report
        run: npm audit --omit=dev --audit-level=high || true
      - run: npm run format:check
      - run: npm run lint
      - name: Architecture checks
        run: npm run test:architecture
      - name: Translation checks
        run: npm run test:translations
      - run: npm run build

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm test

  verify:
    name: Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run verify:all

  gate:
    name: Final gate
    needs: [quality, test, verify]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All checks passed"
