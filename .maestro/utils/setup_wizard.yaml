# Flow: Wizard Quick Setup (reusable)
# Suite: utils (runs from within composed flows 03-13)
# Covers: completes the 4-step wizard with realistic data, then dismisses IntentionSheet.
# Prerequisites: app running, sitting at `wizard-step1-screen` (04-13 run this after 02_onboarding_skip.yaml)
# clearState: false (no launchApp here — the parent flow 02 handles the cold launch)
appId: com.melnady.qadaa
---
- assertVisible:
    id: wizard-step1-screen
- tapOn:
    id: wizard-age-input
- eraseText
- inputText: "28"
- hideKeyboard
- tapOn:
    id: wizard-puberty-input
- eraseText
- inputText: "14"
- hideKeyboard
- swipe:
    start: 50%, 40%
    end: 50%, 30%
    duration: 300
- waitForAnimationToEnd
- tapOn:
    id: wizard-step1-next-btn
- waitForAnimationToEnd
- assertVisible:
    id: wizard-step2-screen
- tapOn:
    id: wizard-years-quick-input
- eraseText
- inputText: "5"
- hideKeyboard
- swipe:
    start: 50%, 40%
    end: 50%, 30%
    duration: 300
- waitForAnimationToEnd
- tapOn:
    id: wizard-step2-next-btn
- waitForAnimationToEnd
- assertVisible:
    id: wizard-step3-screen
- tapOn:
    id: wizard-pace-5-btn
- waitForAnimationToEnd
- tapOn:
    id: wizard-step3-next-btn
- waitForAnimationToEnd
- assertVisible:
    id: wizard-step4-screen
- tapOn:
    id: wizard-confirm-btn
# The celebration Lottie auto-confirms ~2s after the modal appears.
# Wait for the dashboard to appear (the intention sheet auto-confirms ~4s after).
- extendedWaitUntil:
    visible:
      id: dashboard-screen
    timeout: 20000
- extendedWaitUntil:
    notVisible:
      id: intention-sheet
    timeout: 15000
