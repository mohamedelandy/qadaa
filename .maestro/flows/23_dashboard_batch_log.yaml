# Flow: 23 - Dashboard Batch Log (long-press popover)
# Suite: regression
# Covers: long-press → BatchLogPopover → preset +5 → custom count 3 → undo btn visible.
# Prerequisites: flow 02 (cold launch) + setup_wizard (totalMissedDays large → presets enabled).
# clearState: false (flow 02 handles it)
appId: com.melnady.qadaa
---
- runFlow: ../flows/02_onboarding_skip.yaml
- runFlow: ../utils/setup_wizard.yaml
- scrollUntilVisible:
    element:
      id: dashboard-fajr-increment-btn
    direction: DOWN
- longPressOn:
    id: dashboard-fajr-increment-btn
- waitForAnimationToEnd
- assertVisible:
    id: batch-preset-5-btn
- assertVisible:
    id: batch-preset-10-btn
- tapOn:
    id: batch-preset-5-btn
- waitForAnimationToEnd
- assertVisible:
    id: dashboard-fajr-undo-btn
- longPressOn:
    id: dashboard-fajr-increment-btn
- waitForAnimationToEnd
- tapOn:
    id: batch-custom-btn
- waitForAnimationToEnd
- assertVisible:
    id: batch-custom-input
- tapOn:
    id: batch-custom-input
- inputText: "3"
- tapOn:
    point: 50%, 15%
- waitForAnimationToEnd
- tapOn:
    id: batch-custom-confirm-btn
- waitForAnimationToEnd
- assertVisible:
    id: dashboard-fajr-undo-btn