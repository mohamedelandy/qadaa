# Flow: 90 - Wizard Advanced Mode Mixed Periods
# Suite: regression
# Covers: completing the wizard with a mixed advanced configuration: 5 years
#         missed (didn't pray) and 9 years regular (prayed), covering the full
#         14-year active period and producing outstanding prayers.
# Prerequisites: flow 02 (cold launch). Do NOT runFlow setup_wizard — we drive the wizard.
# clearState: false (flow 02 handles it)
appId: com.melnady.qadaa
---
- runFlow: ../flows/02_onboarding_skip.yaml
- assertVisible:
    id: wizard-step1-screen
- tapOn:
    id: wizard-age-input
- eraseText
- inputText: "28"
- tapOn:
    id: wizard-puberty-input
- eraseText
- inputText: "14"
- tapOn:
    point: 50%, 15%
- waitForAnimationToEnd
- tapOn:
    id: wizard-step1-next-btn
- waitForAnimationToEnd
- assertVisible:
    id: wizard-step2-screen
# Toggle advanced mode.
- tapOn:
    id: wizard-step2-advanced-btn
- waitForAnimationToEnd
- assertVisible:
    id: wizard-add-period-btn
# Period 0: "missed" (didn't pray) with 5 years.
- tapOn:
    id: wizard-period-0-type-missed
- waitForAnimationToEnd
- tapOn:
    id: wizard-period-0-years-input
- eraseText
- inputText: "5"
- tapOn:
    point: 50%, 15%
- waitForAnimationToEnd
# Period 1: "regular" (prayed) with 9 years.
- tapOn:
    id: wizard-add-period-btn
- waitForAnimationToEnd
- tapOn:
    id: wizard-period-1-type-regular
- waitForAnimationToEnd
- tapOn:
    id: wizard-period-1-years-input
- eraseText
- inputText: "9"
- tapOn:
    point: 50%, 15%
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: wizard-step2-next-btn
    direction: DOWN
- tapOn:
    id: wizard-step2-next-btn
- waitForAnimationToEnd
- assertVisible:
    id: wizard-step3-screen
- tapOn:
    id: wizard-pace-5-btn
- waitForAnimationToEnd
- tapOn:
    id: wizard-step3-next-btn
- waitForAnimationToEnd
- assertVisible:
    id: wizard-step4-screen
- tapOn:
    id: wizard-confirm-btn
# The intention sheet auto-confirms after ~4s.
- extendedWaitUntil:
    visible:
      id: dashboard-screen
    timeout: 20000
- extendedWaitUntil:
    notVisible:
      id: intention-sheet
    timeout: 15000
# Mixed periods → outstanding prayers remain on the normal dashboard.
- assertVisible:
    id: dashboard-screen
- assertVisible:
    id: dashboard-hero-card
