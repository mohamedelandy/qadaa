# Flow: 14 - Background/Foreground Resilience
# Suite: regression
# Covers: app survives background/foreground transition (stopApp → launchApp without restart).
# Prerequisites: flow 02 (cold launch) + setup_wizard.
# clearState: false (flow 02 handles it)
appId: com.melnady.qadaa
---
- runFlow: ../flows/02_onboarding_skip.yaml
- runFlow: ../utils/setup_wizard.yaml
- assertVisible:
    id: dashboard-screen
- takeScreenshot: bg-resilience-before
# Background the app, then bring it back to the foreground WITHOUT restarting
# (launchApp stopApp: false resumes the existing process, like a real bg→fg transition).
- stopApp
- launchApp:
    stopApp: false
- waitForAnimationToEnd
- assertVisible:
    id: dashboard-screen
- takeScreenshot: bg-resilience-after
