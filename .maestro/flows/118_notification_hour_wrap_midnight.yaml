# Flow: 118 - Notification Hour Wrap-Around at Midnight
# Suite: regression
# Covers: decrementing the hour from 12 to 11 (midnight wrap) and verifying the
#         picker handles the 12→11 transition correctly.
# Prerequisites: flow 02 (cold launch) + setup_wizard.
# clearState: false (flow 02 handles it)
appId: com.melnady.qadaa
---
- runFlow: ../flows/02_onboarding_skip.yaml
- runFlow: ../utils/setup_wizard.yaml
- tapOn:
    id: tab-settings
    retryTapIfNoChange: true
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: hour-up
    direction: DOWN
- assertVisible:
    id: notification-hour-value
# Default hour is 9 → up 3 times → 12.
- tapOn:
    id: hour-up
- waitForAnimationToEnd
- tapOn:
    id: hour-up
- waitForAnimationToEnd
- tapOn:
    id: hour-up
- waitForAnimationToEnd
- copyTextFrom:
    id: notification-hour-value
- assertTrue: "${maestro.copiedText.includes('12')}"
# Down once → 11 (wrap from 12).
- tapOn:
    id: hour-down
- waitForAnimationToEnd
- copyTextFrom:
    id: notification-hour-value
- assertTrue: "${maestro.copiedText.includes('11')}"
# Up once → back to 12.
- tapOn:
    id: hour-up
- waitForAnimationToEnd
- copyTextFrom:
    id: notification-hour-value
- assertTrue: "${maestro.copiedText.includes('12')}"
- assertVisible:
    id: settings-screen
