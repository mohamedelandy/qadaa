# Flow: 49 - Batch Log Points + Undo Refund
# Suite: regression
# Covers: batch logging +5 fajr awards 50 points (10/prayer); one undo refunds
#         exactly 10 (50 → 40, LIFO per-unit); unwinding the rest clears the row.
# Points are read from the stats RankCard (stats-rank-points), which renders
# Arabic-Indic digits in the app's default RTL/Arabic state.
# Prerequisites: flow 02 (cold launch) + setup_wizard (totalMissedDays large → presets enabled).
# clearState: false (flow 02 handles it)
appId: com.melnady.qadaa
---
- runFlow: ../flows/02_onboarding_skip.yaml
- runFlow: ../utils/setup_wizard.yaml
# --- Batch log +5 fajr → 50 points ---
- scrollUntilVisible:
    element:
      id: dashboard-fajr-increment-btn
    direction: DOWN
- longPressOn:
    id: dashboard-fajr-increment-btn
- waitForAnimationToEnd
- assertVisible:
    id: batch-preset-5-btn
- tapOn:
    id: batch-preset-5-btn
- waitForAnimationToEnd
- assertVisible:
    id: dashboard-fajr-undo-btn
# --- Assert award: 50 points on stats ---
- tapOn:
    id: tab-stats
    retryTapIfNoChange: true
- waitForAnimationToEnd
- assertVisible:
    id: stats-screen
- scrollUntilVisible:
    element:
      id: stats-rank-points
    direction: DOWN
- copyTextFrom:
    id: stats-rank-points
- assertTrue: "${maestro.copiedText.includes('50')}"
# --- Undo once → exactly 10 refunded (50 → 40) ---
- tapOn:
    id: tab-dashboard
    retryTapIfNoChange: true
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: dashboard-fajr-undo-btn
    direction: DOWN
- tapOn:
    id: dashboard-fajr-undo-btn
- waitForAnimationToEnd
- tapOn:
    id: tab-stats
    retryTapIfNoChange: true
- waitForAnimationToEnd
- assertVisible:
    id: stats-screen
- scrollUntilVisible:
    element:
      id: stats-rank-points
    direction: DOWN
- copyTextFrom:
    id: stats-rank-points
- assertTrue: "${maestro.copiedText.includes('40')}"
# --- Unwind the remaining 4 units → row fully cleared ---
- tapOn:
    id: tab-dashboard
    retryTapIfNoChange: true
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: dashboard-fajr-undo-btn
    direction: DOWN
- tapOn:
    id: dashboard-fajr-undo-btn
- waitForAnimationToEnd
- tapOn:
    id: dashboard-fajr-undo-btn
- waitForAnimationToEnd
- tapOn:
    id: dashboard-fajr-undo-btn
- waitForAnimationToEnd
- tapOn:
    id: dashboard-fajr-undo-btn
- waitForAnimationToEnd
- assertNotVisible:
    id: dashboard-fajr-undo-btn
