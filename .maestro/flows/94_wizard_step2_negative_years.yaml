# Flow: 94 - Wizard Step 2 Quick Negative Years
# Suite: regression
# Covers: entering "-1" in the quick years input is rejected by validation;
#         Next stays disabled and the error is shown.
# Prerequisites: flow 02 (cold launch). Do NOT runFlow setup_wizard — we drive the wizard.
# clearState: false (flow 02 handles it)
appId: com.melnady.qadaa
---
- runFlow: ../flows/02_onboarding_skip.yaml
- assertVisible:
    id: wizard-step1-screen
- tapOn:
    id: wizard-age-input
- eraseText
- inputText: "28"
- tapOn:
    id: wizard-puberty-input
- eraseText
- inputText: "14"
- tapOn:
    point: 50%, 15%
- waitForAnimationToEnd
- tapOn:
    id: wizard-step1-next-btn
- waitForAnimationToEnd
- assertVisible:
    id: wizard-step2-screen
- tapOn:
    id: wizard-years-quick-input
- eraseText
- inputText: "-1"
- tapOn:
    point: 50%, 15%
- waitForAnimationToEnd
# Negative value → error visible, Next disabled.
- assertVisible:
    id: wizard-step2-error
- assertVisible:
    id: wizard-step2-next-btn
    enabled: false
# Tapping disabled Next must not advance.
- tapOn:
    id: wizard-step2-next-btn
- waitForAnimationToEnd
- assertVisible:
    id: wizard-step2-screen
