# Flow: 101 - Onboarding Skip from Each Slide
# Suite: regression
# Covers: the skip button works from slides 2, 3, and 4 (not just slide 1).
#         Flow 02 only tests skip from slide 1.
# Prerequisites: none (fresh state via clearState)
# clearState: true (cold start must begin at onboarding)
appId: com.melnady.qadaa
---
- launchApp:
    clearState: true
    arguments:
      AppleLanguages: "(en)"
      AppleLocale: "en_UK"
- waitForAnimationToEnd
- assertVisible:
    id: onboarding-slide-1
# Advance to slide 2, then skip.
- tapOn:
    id: onboarding-next-btn
- waitForAnimationToEnd
- assertVisible:
    id: onboarding-slide-2
- tapOn:
    id: onboarding-skip-btn
- waitForAnimationToEnd
- assertVisible:
    id: wizard-step1-screen
