# Flow: 00 - App Launch
# Suite: smoke
# Covers: cold start end-to-end; splash resolves; onboarding slide 1 rendered; no crash.
# Prerequisites: none (fresh state via clearState)
# clearState: true (cold start must begin at onboarding)
appId: com.melnady.qadaa
---
- launchApp:
    clearState: true
    arguments:
      AppleLanguages: "(en)"
      AppleLocale: "en_UK"
- waitForAnimationToEnd
- assertVisible:
    id: onboarding-slide-1