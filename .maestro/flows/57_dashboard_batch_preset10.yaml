# Flow: 57 - Batch Log +10 Preset Points
# Suite: regression
# Covers: batch logging +10 fajr via the +10 preset awards 100 points
#         (10/prayer × 10) — the +10 preset was asserted visible by flow 23 but
#         never actually tapped.
# Prerequisites: flow 02 (cold launch) + setup_wizard (totalMissedDays large → presets enabled).
# clearState: false (flow 02 handles it)
appId: com.melnady.qadaa
---
- runFlow: ../flows/02_onboarding_skip.yaml
- runFlow: ../utils/setup_wizard.yaml
# --- Batch log +10 fajr → 100 points ---
- scrollUntilVisible:
    element:
      id: dashboard-fajr-increment-btn
    direction: DOWN
- longPressOn:
    id: dashboard-fajr-increment-btn
- waitForAnimationToEnd
- assertVisible:
    id: batch-preset-10-btn
- tapOn:
    id: batch-preset-10-btn
- waitForAnimationToEnd
- assertVisible:
    id: dashboard-fajr-undo-btn
# --- Assert award: 100 points on stats (Arabic-Indic digits, RTL default) ---
- tapOn:
    id: tab-stats
    retryTapIfNoChange: true
- waitForAnimationToEnd
- assertVisible:
    id: stats-screen
- scrollUntilVisible:
    element:
      id: stats-rank-points
    direction: DOWN
- copyTextFrom:
    id: stats-rank-points
- assertTrue: "${maestro.copiedText.includes('100')}"
