# Flow: 131 - Sync Clipboard Copied State
# Suite: regression
# Covers: after tapping the copy button in the sync clipboard tab, the button
#         text changes from the copy label to the "copied" feedback label for
#         2 seconds. Flow 28 taps the copy button but never verifies this
#         feedback state; flow 69 copies the JSON preview text but not the
#         button's own text change.
# Prerequisites: flow 02 (cold launch) + setup_wizard.
# clearState: false (flow 02 handles it)
appId: com.melnady.qadaa
---
- runFlow: ../flows/02_onboarding_skip.yaml
- runFlow: ../utils/setup_wizard.yaml
- tapOn:
    id: tab-settings
    retryTapIfNoChange: true
- waitForAnimationToEnd
- assertVisible:
    id: settings-screen
- scrollUntilVisible:
    element:
      id: settings-sync-btn
    direction: DOWN
- tapOn:
    id: settings-sync-btn
- waitForAnimationToEnd
- tapOn:
    id: sync-tab-clipboard
- waitForAnimationToEnd
- assertVisible:
    id: sync-copy-btn
# Before copy: button shows the copy label (Arabic: "نسخ").
- copyTextFrom:
    id: sync-copy-btn
# Tap the copy button — triggers the "copied" feedback state.
- tapOn:
    id: sync-copy-btn
- waitForAnimationToEnd
# After copy: button text changes to "copied" feedback (Arabic: "✓ Copied!").
- copyTextFrom:
    id: sync-copy-btn
- assertTrue: "${maestro.copiedText.includes('Copied')}"
- tapOn:
    id: sync-close-btn
    optional: true
- waitForAnimationToEnd
- swipe:
    start: 50%, 90%
    end: 50%, 10%
- waitForAnimationToEnd
- assertVisible:
    id: settings-screen
