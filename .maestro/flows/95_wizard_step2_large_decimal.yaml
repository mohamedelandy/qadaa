# Flow: 95 - Wizard Step 2 Quick Very Large Decimal
# Suite: regression
# Covers: entering "99.99" in the quick years input exceeds prayerActiveYears (14)
#         and shows the validation error with Next disabled.
# Prerequisites: flow 02 (cold launch). Do NOT runFlow setup_wizard — we drive the wizard.
# clearState: false (flow 02 handles it)
appId: com.melnady.qadaa
---
- runFlow: ../flows/02_onboarding_skip.yaml
- assertVisible:
    id: wizard-step1-screen
- tapOn:
    id: wizard-age-input
- eraseText
- inputText: "28"
- tapOn:
    id: wizard-puberty-input
- eraseText
- inputText: "14"
- tapOn:
    point: 50%, 15%
- waitForAnimationToEnd
- tapOn:
    id: wizard-step1-next-btn
- waitForAnimationToEnd
- assertVisible:
    id: wizard-step2-screen
- tapOn:
    id: wizard-years-quick-input
- eraseText
- inputText: "99.99"
- tapOn:
    point: 50%, 15%
- waitForAnimationToEnd
# 99.99 > 14 (prayerActiveYears) → error, Next disabled.
- assertVisible:
    id: wizard-step2-error
- assertVisible:
    id: wizard-step2-next-btn
    enabled: false
# Fix to valid value → error clears, Next advances.
- tapOn:
    id: wizard-years-quick-input
- eraseText
- inputText: "5"
- tapOn:
    point: 50%, 15%
- waitForAnimationToEnd
- assertNotVisible:
    id: wizard-step2-error
- tapOn:
    id: wizard-step2-next-btn
- waitForAnimationToEnd
- assertVisible:
    id: wizard-step3-screen
