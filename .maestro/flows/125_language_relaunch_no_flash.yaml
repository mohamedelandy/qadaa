# Flow: 125 - Language Relaunch First Frame (No Flash)
# Suite: regression
# Covers: after switching the UI to English and terminating/relaunching (no
#         clearState), the FIRST painted frame is already in the persisted
#         language — the boot gate applies the stored language before any
#         content renders, so there is no Arabic/device-locale flash followed
#         by a remount. Evidence: a first-frame screenshot, then copyTextFrom
#         of the fajr remaining label (language-bearing) asserting the ENGLISH
#         rendering ("N remaining") with zero Arabic glyphs. The label's count
#         is wizard-dependent (totalMissedDays), so only the word is asserted.
# Prerequisites: flow 02 (cold launch, device language forced to Arabic) + setup_wizard.
# clearState: false (flow 02 handles it; relaunch below intentionally omits clearState)
appId: com.melnady.qadaa
---
- runFlow: ../flows/02_onboarding_skip.yaml
- runFlow: ../utils/setup_wizard.yaml
- tapOn:
    id: tab-settings
    retryTapIfNoChange: true
- waitForAnimationToEnd
- assertVisible:
    id: settings-screen
- tapOn:
    id: settings-lang-en-btn
- waitForAnimationToEnd
# Language toggle remounts the app but stays on Settings (English now).
- assertVisible:
    id: settings-screen
# Terminate and relaunch WITHOUT clearState — the persisted language (English)
# must be applied BEFORE the first frame renders (no Arabic flash, no remount).
- stopApp
- launchApp
- waitForAnimationToEnd
# First settled frame after relaunch — visual evidence for the no-flash claim.
- takeScreenshot: relaunch-first-frame-english
- assertVisible:
    id: dashboard-screen
# Scroll the language-bearing label into view if needed, then read its text.
- scrollUntilVisible:
    element:
      id: dashboard-fajr-remaining
    direction: DOWN
- copyTextFrom:
    id: dashboard-fajr-remaining
# The English rendering is present on the first frame (persisted language won).
- assertTrue: "${/remaining/.test(maestro.copiedText)}"
# And the copied label contains zero Arabic glyphs — the anti-flash assertion.
- assertTrue: '${! /[\u0600-\u06FF]/.test(maestro.copiedText)}'
# The app stays in the persisted language end-to-end (English settings labels).
- tapOn:
    id: tab-settings
    retryTapIfNoChange: true
- waitForAnimationToEnd
- assertVisible:
    id: settings-screen
- assertVisible:
    text: "Language"
- assertVisible:
    text: "Daily Pace"
