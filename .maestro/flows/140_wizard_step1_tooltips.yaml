# Flow: Wizard Step 1 — Tooltip tap & popover verification
# Suite: regression
# Covers: tap each tooltip trigger on wizard step 1, assert popover text visible,
#         verify auto-dismiss after 3 s.
# Prerequisites: none (standalone — own launchApp with clearState: true)
appId: com.melnady.qadaa
---
- launchApp:
    clearState: true
    arguments:
      AppleLanguages: "(en)"
      AppleLocale: "en_UK"
- waitForAnimationToEnd
- tapOn:
    id: onboarding-skip-btn
- waitForAnimationToEnd
- assertVisible:
    id: wizard-step1-screen
# ============================================================================
# 1. AGE TOOLTIP — tap trigger, assert popover visible
# ============================================================================
- tapOn:
    id: wizard-age-tooltip-trigger
- waitForAnimationToEnd
- assertVisible:
    id: wizard-age-tooltip-popover
- waitForAnimationToEnd
# ============================================================================
# 2. PUBERTY TOOLTIP — tap trigger, assert popover visible
# ============================================================================
- tapOn:
    id: wizard-puberty-tooltip-trigger
- waitForAnimationToEnd
- assertVisible:
    id: wizard-puberty-tooltip-popover
- waitForAnimationToEnd
