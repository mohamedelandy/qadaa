# Flow: 88 - Settings Custom Target Zero
# Suite: regression
# Covers: custom daily target "0" is below the minimum (1) and shows the range
#         validation error; Save is disabled. This is the lower-bound edge case
#         complementing flow 73 (upper-bound 51).
# Prerequisites: flow 02 (cold launch) + setup_wizard.
# clearState: false (flow 02 handles it)
appId: com.melnady.qadaa
---
- runFlow: ../flows/02_onboarding_skip.yaml
- runFlow: ../utils/setup_wizard.yaml
- tapOn:
    id: tab-settings
    retryTapIfNoChange: true
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: settings-presets-grid
    direction: DOWN
- tapOn:
    id: settings-pace-custom-btn
- waitForAnimationToEnd
- assertVisible:
    id: settings-pace-custom-input
- tapOn:
    id: settings-pace-custom-input
- eraseText
- inputText: "0"
- tapOn:
    point: 50%, 15%
- waitForAnimationToEnd
# 0 < 1 (minimum) → range error visible.
- extendedWaitUntil:
    visible:
      id: settings-target-error
    timeout: 10000
- tapOn:
    id: settings-target-save-btn
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: settings-target-error
    timeout: 10000
