# Flow: 53 - Notification Picker Save Persists
# Suite: regression
# Covers: changing the reminder time (hour 9 → 11, minute 00) and saving persists
#         to the settings store — the picker re-reads 11 after leaving and
#         returning to settings. Saving requests notification permission, so this
#         flow pre-grants it at launch (standalone, like flow 16).
# Prerequisites: none (standalone — own launchApp with clearState + permission grant)
# clearState: true (cold start; do NOT runFlow 02 — it would double-launch)
appId: com.melnady.qadaa
---
- launchApp:
    clearState: true
    arguments:
      AppleLanguages: "(en)"
      AppleLocale: "en_UK"
    permissions:
      notifications: granted
- waitForAnimationToEnd
- assertVisible:
    id: onboarding-slide-1
- tapOn:
    id: onboarding-skip-btn
- waitForAnimationToEnd
- runFlow: ../utils/setup_wizard.yaml
- tapOn:
    id: tab-settings
    retryTapIfNoChange: true
- waitForAnimationToEnd
- assertVisible:
    id: settings-screen
- scrollUntilVisible:
    element:
      id: hour-up
    direction: DOWN
- assertVisible:
    id: notification-hour-value
# 9 → 11 (two taps), minute 00, save (permission pre-granted → no dialog)
- tapOn:
    id: hour-up
- waitForAnimationToEnd
- tapOn:
    id: hour-up
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: settings-minute-00
    direction: DOWN
- tapOn:
    id: settings-minute-00
- waitForAnimationToEnd
- tapOn:
    id: notification-save-btn
- waitForAnimationToEnd
# Re-mount settings from the store and verify the saved hour persisted
- tapOn:
    id: tab-dashboard
    retryTapIfNoChange: true
- waitForAnimationToEnd
- tapOn:
    id: tab-settings
    retryTapIfNoChange: true
- waitForAnimationToEnd
- assertVisible:
    id: settings-screen
- scrollUntilVisible:
    element:
      id: notification-hour-value
    direction: DOWN
- copyTextFrom:
    id: notification-hour-value
- assertTrue: "${maestro.copiedText.includes('11')}"
