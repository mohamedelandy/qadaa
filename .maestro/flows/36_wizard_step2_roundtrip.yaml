# Flow: 36 - Wizard Step 2 Roundtrip Advanced → Quick
# Suite: regression
# Covers: advanced→quick and quick→advanced preserve data
# Prerequisites: flow 02 (cold launch). Do NOT runFlow setup_wizard — we drive the wizard.
# clearState: false (flow 02 handles it)
appId: com.melnady.qadaa
---
- runFlow: ../flows/02_onboarding_skip.yaml
- assertVisible:
    id: wizard-step1-screen
- tapOn:
    id: wizard-age-input
- eraseText
- inputText: "28"
- tapOn:
    id: wizard-puberty-input
- eraseText
- inputText: "14"
- tapOn:
    point: 50%, 15%
- waitForAnimationToEnd
- tapOn:
    id: wizard-step1-next-btn
- waitForAnimationToEnd
- assertVisible:
    id: wizard-step2-screen
# Advanced → Quick
- tapOn:
    id: wizard-step2-advanced-btn
- waitForAnimationToEnd
- assertVisible:
    id: wizard-add-period-btn
- tapOn:
    id: wizard-add-period-btn
- waitForAnimationToEnd
- tapOn:
    id: wizard-period-0-years-input
- eraseText
- inputText: "3"
- tapOn:
    point: 50%, 15%
- waitForAnimationToEnd
- tapOn:
    id: wizard-period-1-years-input
- eraseText
- inputText: "2"
- tapOn:
    point: 50%, 15%
- waitForAnimationToEnd
- tapOn:
    id: wizard-step2-advanced-btn
- waitForAnimationToEnd
- assertVisible:
    id: wizard-years-quick-input
# The carried-over quick value (3 + 2 missed years) is already in the field
# Quick → Advanced
- tapOn:
    id: wizard-step2-advanced-btn
- waitForAnimationToEnd
- assertVisible:
    id: wizard-period-0-years-input
- assertVisible:
    id: wizard-step2-meter
# Complete wizard
- tapOn:
    id: wizard-step2-next-btn
- waitForAnimationToEnd
- assertVisible:
    id: wizard-step3-screen
- tapOn:
    id: wizard-pace-5-btn
- waitForAnimationToEnd
- tapOn:
    id: wizard-step3-next-btn
- waitForAnimationToEnd
- assertVisible:
    id: wizard-step4-screen
- tapOn:
    id: wizard-confirm-btn
# The intention sheet auto-confirms after ~4s — wait deterministically for the
# dashboard to mount, then for the sheet to close itself.
- extendedWaitUntil:
    visible:
      id: dashboard-screen
    timeout: 20000
- extendedWaitUntil:
    notVisible:
      id: intention-sheet
    timeout: 15000
- assertVisible:
    id: dashboard-screen