# Flow: 35 - Wizard Step 2 Advanced Multi Period
# Suite: regression
# Covers: advanced mode add 3 periods, switch types, remove one, meter + counter update
# Prerequisites: flow 02 (cold launch). Do NOT runFlow setup_wizard — we drive the wizard.
# clearState: false (flow 02 handles it)
appId: com.melnady.qadaa
---
- runFlow: ../flows/02_onboarding_skip.yaml
- assertVisible:
    id: wizard-step1-screen
- tapOn:
    id: wizard-age-input
- eraseText
- inputText: "28"
- tapOn:
    id: wizard-puberty-input
- eraseText
- inputText: "14"
- tapOn:
    point: 50%, 15%
- waitForAnimationToEnd
- tapOn:
    id: wizard-step1-next-btn
- waitForAnimationToEnd
- assertVisible:
    id: wizard-step2-screen
- tapOn:
    id: wizard-step2-advanced-btn
- waitForAnimationToEnd
- assertVisible:
    id: wizard-add-period-btn
- tapOn:
    id: wizard-add-period-btn
- waitForAnimationToEnd
- tapOn:
    id: wizard-add-period-btn
- waitForAnimationToEnd
- assertVisible:
    id: wizard-period-2-type-missed
- tapOn:
    id: wizard-period-0-type-regular
- waitForAnimationToEnd
- tapOn:
    id: wizard-period-2-type-regular
- waitForAnimationToEnd
- tapOn:
    id: wizard-period-0-years-input
- eraseText
- inputText: "2.5"
- tapOn:
    point: 50%, 15%
- waitForAnimationToEnd
- tapOn:
    id: wizard-period-1-years-input
- eraseText
- inputText: "1.5"
- tapOn:
    point: 50%, 15%
- waitForAnimationToEnd
- assertVisible:
    id: wizard-step2-meter
- tapOn:
    id: wizard-period-2-remove-btn
- waitForAnimationToEnd
- assertNotVisible:
    id: wizard-period-2-type-missed
- tapOn:
    id: wizard-step2-next-btn
- waitForAnimationToEnd
- assertVisible:
    id: wizard-step3-screen