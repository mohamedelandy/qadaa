# Flow: 59 - Notification Picker Hour Down
# Suite: regression
# Covers: the hour-down arrow decrements the reminder hour (9 → 8 → 7) and
#         hour-up restores it — the decrement path was asserted visible by
#         flows 22/53 but never actually tapped.
# Prerequisites: flow 02 (cold launch) + setup_wizard.
# clearState: false (flow 02 handles it)
appId: com.melnady.qadaa
---
- runFlow: ../flows/02_onboarding_skip.yaml
- runFlow: ../utils/setup_wizard.yaml
- tapOn:
    id: tab-settings
    retryTapIfNoChange: true
- waitForAnimationToEnd
- assertVisible:
    id: settings-screen
- scrollUntilVisible:
    element:
      id: hour-down
    direction: DOWN
- assertVisible:
    id: notification-hour-value
# Default hour is 9 → down → 8 → 7 (Latin digits, raw value text).
- tapOn:
    id: hour-down
- waitForAnimationToEnd
- copyTextFrom:
    id: notification-hour-value
- assertTrue: "${maestro.copiedText.includes('8')}"
- tapOn:
    id: hour-down
- waitForAnimationToEnd
- copyTextFrom:
    id: notification-hour-value
- assertTrue: "${maestro.copiedText.includes('7')}"
# Up twice restores the original value.
- tapOn:
    id: hour-up
- waitForAnimationToEnd
- tapOn:
    id: hour-up
- waitForAnimationToEnd
- copyTextFrom:
    id: notification-hour-value
- assertTrue: "${maestro.copiedText.includes('9')}"
- assertVisible:
    id: settings-screen
