# Flow: 54 - Stats Empty State
# Suite: regression
# Covers: right after wizard completion (0 points, 0 streak) the stats screen
#         renders its empty state instead of the stat cards.
# Prerequisites: flow 02 (cold launch) + setup_wizard.
# clearState: false (flow 02 handles it)
appId: com.melnady.qadaa
---
- runFlow: ../flows/02_onboarding_skip.yaml
- runFlow: ../utils/setup_wizard.yaml
- tapOn:
    id: tab-stats
    retryTapIfNoChange: true
- waitForAnimationToEnd
- assertVisible:
    id: stats-screen
# Fresh account: no points, no streak → empty state, no stat cards.
- assertVisible:
    id: stats-empty-state
# Stats empty state renders the Lottie variant (not the Ionicons icon).
- assertVisible:
    id: lottie-empty-chart
- assertNotVisible:
    id: stats-streak-count
- assertNotVisible:
    id: stats-level-count
