# Flow: 96 - Wizard Step 3 Preset Selection Updates Step 4 Total
# Suite: regression
# Covers: selecting different pace presets on step 3 and verifying the step 4
#         summary total changes accordingly (pace-1 → 1/day, pace-10 → 10/day).
# Prerequisites: flow 02 (cold launch). Do NOT runFlow setup_wizard — we drive the wizard.
# clearState: false (flow 02 handles it)
appId: com.melnady.qadaa
---
- runFlow: ../flows/02_onboarding_skip.yaml
- assertVisible:
    id: wizard-step1-screen
- tapOn:
    id: wizard-age-input
- eraseText
- inputText: "28"
- tapOn:
    id: wizard-puberty-input
- eraseText
- inputText: "14"
- tapOn:
    point: 50%, 15%
- waitForAnimationToEnd
- tapOn:
    id: wizard-step1-next-btn
- waitForAnimationToEnd
- tapOn:
    id: wizard-years-quick-input
- eraseText
- inputText: "5"
- tapOn:
    point: 50%, 15%
- waitForAnimationToEnd
- tapOn:
    id: wizard-step2-next-btn
- waitForAnimationToEnd
- assertVisible:
    id: wizard-step3-screen
# Select pace-1 → advance to step 4.
- tapOn:
    id: wizard-pace-1-btn
- waitForAnimationToEnd
- tapOn:
    id: wizard-step3-next-btn
- waitForAnimationToEnd
- assertVisible:
    id: wizard-step4-screen
# Step 4 summary visible with pace-1 data.
- assertVisible:
    id: step4-row-0
# Go back to step 3, switch to pace-10.
- tapOn:
    id: wizard-step4-back-btn
- waitForAnimationToEnd
- assertVisible:
    id: wizard-step3-screen
- tapOn:
    id: wizard-pace-10-btn
- waitForAnimationToEnd
- tapOn:
    id: wizard-step3-next-btn
- waitForAnimationToEnd
- assertVisible:
    id: wizard-step4-screen
# Step 4 summary still visible with updated pace-10 data.
- assertVisible:
    id: step4-row-0
- tapOn:
    id: wizard-confirm-btn
- extendedWaitUntil:
    visible:
      id: dashboard-screen
    timeout: 20000
- extendedWaitUntil:
    notVisible:
      id: intention-sheet
    timeout: 15000
- assertVisible:
    id: dashboard-screen
# Pace-10 → dashboard pill reads 0/10.
- assertVisible: "0/10"
