# Flow: 51 - Full-Day Log Points + Undo Refund
# Suite: regression
# Covers: the full-day log awards the bonus (20/prayer × 5 = 100 points); one
#         undo refunds exactly one 20-point unit (100 → 80). Reads the points
#         balance from the stats RankCard (Arabic-Indic digits, RTL default).
# Prerequisites: flow 02 (cold launch) + setup_wizard.
# clearState: false (flow 02 handles it)
appId: com.melnady.qadaa
---
- runFlow: ../flows/02_onboarding_skip.yaml
- runFlow: ../utils/setup_wizard.yaml
# --- Full-day log → 100 points (20 × 5) ---
- assertVisible:
    id: dashboard-fullday-btn
- tapOn:
    id: dashboard-fullday-btn
- waitForAnimationToEnd
- assertVisible:
    id: dua-modal
- tapOn:
    id: dua-close-btn
- waitForAnimationToEnd
- tapOn:
    id: tab-stats
    retryTapIfNoChange: true
- waitForAnimationToEnd
- assertVisible:
    id: stats-screen
- scrollUntilVisible:
    element:
      id: stats-rank-points
    direction: DOWN
- copyTextFrom:
    id: stats-rank-points
- assertTrue: "${maestro.copiedText.includes('100')}"
# --- Undo one prayer → refunds exactly 20 (100 → 80) ---
- tapOn:
    id: tab-dashboard
    retryTapIfNoChange: true
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: dashboard-fajr-undo-btn
    direction: DOWN
- tapOn:
    id: dashboard-fajr-undo-btn
- waitForAnimationToEnd
- tapOn:
    id: tab-stats
    retryTapIfNoChange: true
- waitForAnimationToEnd
- assertVisible:
    id: stats-screen
- scrollUntilVisible:
    element:
      id: stats-rank-points
    direction: DOWN
- copyTextFrom:
    id: stats-rank-points
- assertTrue: "${maestro.copiedText.includes('80')}"
