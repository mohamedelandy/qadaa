# Flow: 45 - Sync QR Tab
# Suite: regression
# Covers: QR tab in the sync sheet renders the QR export surface without crashing
#         (QR generation is async; the container is the stable anchor for both
#         the loading and rendered states). Clipboard/import tabs are covered by flow 28.
# Prerequisites: flow 02 (cold launch) + setup_wizard.
# clearState: false (flow 02 handles it)
appId: com.melnady.qadaa
---
- runFlow: ../flows/02_onboarding_skip.yaml
- runFlow: ../utils/setup_wizard.yaml
- tapOn:
    id: tab-settings
    retryTapIfNoChange: true
- waitForAnimationToEnd
- assertVisible:
    id: settings-screen
- scrollUntilVisible:
    element:
      id: settings-sync-btn
    direction: DOWN
- tapOn:
    id: settings-sync-btn
- waitForAnimationToEnd
- assertVisible:
    id: sync-tab-qr
- tapOn:
    id: sync-tab-qr
- waitForAnimationToEnd
- assertVisible:
    id: sync-qr-container
- tapOn:
    id: sync-close-btn
    optional: true
- waitForAnimationToEnd
- swipe:
    start: 50%, 90%
    end: 50%, 10%
- waitForAnimationToEnd
- assertVisible:
    id: settings-screen
