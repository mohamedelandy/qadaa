# Flow: 06 - Dashboard Full-Day Log
# Suite: regression
# Covers: tap Log Full Day, dismiss DuaModal, verify all 5 rows logged, verify points on stats.
# Prerequisites: flow 02 (cold launch) + setup_wizard.
# clearState: false (flow 02 handles it)
appId: com.melnady.qadaa
---
- runFlow: ../flows/02_onboarding_skip.yaml
- runFlow: ../utils/setup_wizard.yaml
- assertVisible:
    id: dashboard-fullday-btn
- tapOn:
    id: dashboard-fullday-btn
- waitForAnimationToEnd
- assertVisible:
    id: dua-modal
- tapOn:
    id: dua-close-btn
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: dashboard-fajr-increment-btn
    direction: UP
- assertVisible:
    id: dashboard-fajr-row
- assertVisible:
    id: dashboard-dhuhr-row
- assertVisible:
    id: dashboard-asr-row
- assertVisible:
    id: dashboard-maghrib-row
- assertVisible:
    id: dashboard-isha-row
- tapOn:
    id: tab-stats
    retryTapIfNoChange: true
- waitForAnimationToEnd
- assertVisible:
    id: stats-screen
- assertVisible:
    id: stats-level-count