# Flow: 62 - Wizard Pace Preset 1
# Suite: regression
# Covers: completing the wizard with the pace-1 preset lands on a dashboard
#         whose hero pill reads 0/1 (previously only pace-5 and custom were
#         exercised in the wizard).
# Prerequisites: flow 02 (cold launch). Do NOT runFlow setup_wizard — we drive the wizard.
# clearState: false (flow 02 handles it)
appId: com.melnady.qadaa
---
- runFlow: ../flows/02_onboarding_skip.yaml
- assertVisible:
    id: wizard-step1-screen
- tapOn:
    id: wizard-age-input
- eraseText
- inputText: "28"
- tapOn:
    id: wizard-puberty-input
- eraseText
- inputText: "14"
- tapOn:
    point: 50%, 15%
- waitForAnimationToEnd
- tapOn:
    id: wizard-step1-next-btn
- waitForAnimationToEnd
- assertVisible:
    id: wizard-step2-screen
- tapOn:
    id: wizard-years-quick-input
- eraseText
- inputText: "5"
- tapOn:
    point: 50%, 15%
- waitForAnimationToEnd
- tapOn:
    id: wizard-step2-next-btn
- waitForAnimationToEnd
- assertVisible:
    id: wizard-step3-screen
- assertVisible:
    id: step3-presets-grid
- tapOn:
    id: wizard-pace-1-btn
- waitForAnimationToEnd
- tapOn:
    id: wizard-step3-next-btn
- waitForAnimationToEnd
- assertVisible:
    id: wizard-step4-screen
- tapOn:
    id: wizard-confirm-btn
# The intention sheet auto-confirms after ~4s — wait deterministically for the
# dashboard to mount, then for the sheet to close itself.
- extendedWaitUntil:
    visible:
      id: dashboard-screen
    timeout: 20000
- extendedWaitUntil:
    notVisible:
      id: intention-sheet
    timeout: 15000
- assertVisible:
    id: dashboard-screen
- assertVisible: "0/1"
