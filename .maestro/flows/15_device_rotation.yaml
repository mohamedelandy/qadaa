# Flow: 15 - Device Rotation
# Suite: regression
# Covers: app handles rotation changes from portrait to landscape and back.
# Prerequisites: flow 02 (cold launch) + setup_wizard.
# clearState: false (flow 02 handles it)
appId: com.melnady.qadaa
---
- runFlow: ../flows/02_onboarding_skip.yaml
- runFlow: ../utils/setup_wizard.yaml
- assertVisible:
    id: dashboard-screen
- takeScreenshot: rotation-portrait
- setOrientation: LANDSCAPE_LEFT
- waitForAnimationToEnd
- takeScreenshot: rotation-landscape
- assertVisible:
    id: dashboard-screen
- setOrientation: PORTRAIT
- waitForAnimationToEnd
- takeScreenshot: rotation-back-portrait
- assertVisible:
    id: dashboard-screen
