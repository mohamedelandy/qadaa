# Flow: 32 - Widget Sync
# Suite: regression
# Covers: app-side actions that trigger widget payload pushes, so the sync path is
#         exercised end-to-end. Maestro cannot read the home-screen widget, so this
#         flow asserts the in-app effects of the same actions:
#           - logging a prayer (prayer-store push) → dashboard row completed state + streak
#           - toggling language ar<->en (settings-store push) → language-dependent label
#         The widget's own on-home-screen rendering is covered manually / by unit tests.
# Prerequisites: flow 02 (cold launch) + setup_wizard.
# clearState: false (flow 02 handles it)
appId: com.melnady.qadaa
---
- runFlow: ../flows/02_onboarding_skip.yaml
- runFlow: ../utils/setup_wizard.yaml
# --- Dashboard: log a prayer, assert the row reflects the log (widget payload push) ---
- scrollUntilVisible:
    element:
      id: dashboard-fajr-increment-btn
    direction: DOWN
- assertVisible:
    id: dashboard-fajr-increment-btn
- tapOn:
    id: dashboard-fajr-increment-btn
- waitForAnimationToEnd
- assertVisible:
    id: dashboard-fajr-undo-btn
- assertVisible:
    id: dashboard-streak-count
# --- Settings: toggle language ar<->en (settings-store push) ---
- tapOn:
    id: tab-settings
    retryTapIfNoChange: true
- waitForAnimationToEnd
- assertVisible:
    id: settings-lang-en-btn
- tapOn:
    id: settings-lang-en-btn
- waitForAnimationToEnd
# language toggle remounts the app and drops to the dashboard
- tapOn:
    id: tab-settings
    retryTapIfNoChange: true
- waitForAnimationToEnd
- assertVisible:
    id: settings-screen
- tapOn:
    id: settings-lang-ar-btn
- waitForAnimationToEnd
# language toggle remounts the app and drops to the dashboard
- tapOn:
    id: tab-settings
    retryTapIfNoChange: true
- waitForAnimationToEnd
- assertVisible:
    id: settings-screen
# --- Dashboard: undo then re-log, assert the dashboard updates (widget payload push) ---
- tapOn:
    id: tab-dashboard
    retryTapIfNoChange: true
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: dashboard-fajr-undo-btn
    direction: DOWN
- assertVisible:
    id: dashboard-fajr-undo-btn
- tapOn:
    id: dashboard-fajr-undo-btn
- waitForAnimationToEnd
- assertNotVisible:
    id: dashboard-fajr-undo-btn
- scrollUntilVisible:
    element:
      id: dashboard-fajr-increment-btn
    direction: DOWN
- tapOn:
    id: dashboard-fajr-increment-btn
- waitForAnimationToEnd
- assertVisible:
    id: dashboard-fajr-undo-btn
