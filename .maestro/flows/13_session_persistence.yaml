# Flow: 13 - Session Persistence
# Suite: regression
# Covers: log a prayer, terminate and relaunch the app, verify data survived (dashboard, not
#         onboarding/wizard). State must survive — NO clearState on the relaunch.
# Prerequisites: flow 02 (cold launch) + setup_wizard.
# clearState: false (flow 02 handles it; relaunch below intentionally omits clearState)
appId: com.melnady.qadaa
---
- runFlow: ../flows/02_onboarding_skip.yaml
- runFlow: ../utils/setup_wizard.yaml
- tapOn:
    id: dashboard-fajr-increment-btn
- waitForAnimationToEnd
- stopApp
- launchApp
- waitForAnimationToEnd
- assertVisible:
    id: dashboard-screen
- assertVisible:
    id: dashboard-streak-count