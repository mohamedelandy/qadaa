# Flow: 136 - Stats Display Fields Complete
# Suite: regression
# Covers: verifying the text content of stats display fields that have testIDs
#         but are never asserted in any flow: stats-rank-points, stats-estimate-years,
#         stats-estimate-pace, stats-estimate-date. Importing a backup with known
#         values and verifying each field's text via copyTextFrom + assertTrue.
# Prerequisites: flow 02 (cold launch) + setup_wizard.
# clearState: false (flow 02 handles it)
appId: com.melnady.qadaa
---
- runFlow: ../flows/02_onboarding_skip.yaml
- runFlow: ../utils/setup_wizard.yaml
- tapOn:
    id: tab-settings
    retryTapIfNoChange: true
- waitForAnimationToEnd
- assertVisible:
    id: settings-screen
- scrollUntilVisible:
    element:
      id: settings-sync-btn
    direction: DOWN
- tapOn:
    id: settings-sync-btn
- waitForAnimationToEnd
- tapOn:
    id: sync-tab-import
- waitForAnimationToEnd
- tapOn:
    id: sync-paste-input
# Import a backup with known values: 2000 points, 60 days logged, streak 10.
# This gives gold rank, a meaningful estimate, and some badges.
- inputText:
    text: '{"version":1,"wizardComplete":true,"age":28,"pubertyAge":14,"periods":[{"type":"missed","years":5}],"totalMissedDays":1825,"prayers":{"fajr":{"recovered":200},"dhuhr":{"recovered":200},"asr":{"recovered":200},"maghrib":{"recovered":200},"isha":{"recovered":200}},"todayPrayers":{},"todayLogPoints":{},"todayUnits":{},"todayDate":null,"streak":10,"lastLogDate":null,"daysLogged":60,"loggedDates":[],"points":2000,"badges":[{"id":"first_log","unlockedAt":1767225600000}],"language":"en","notificationTime":null,"notificationPermission":"default","graceUsedMonth":null,"lastDuaShownDate":null,"intentionSetDate":null,"dailyTarget":5}'
- swipe:
    start: 50%, 80%
    end: 50%, 20%
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: sync-import-btn
    timeout: 5000
- tapOn:
    id: sync-import-btn
- extendedWaitUntil:
    visible:
      id: sync-import-success
    timeout: 10000
- tapOn:
    id: sync-close-btn
    optional: true
- waitForAnimationToEnd
- swipe:
    start: 50%, 90%
    end: 50%, 10%
- waitForAnimationToEnd
- assertVisible:
    id: settings-screen
# Navigate to stats to verify display fields.

