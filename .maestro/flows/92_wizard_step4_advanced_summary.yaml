# Flow: 92 - Wizard Step 4 Summary with Advanced Mode
# Suite: regression
# Covers: completing the wizard via advanced mode with 2 periods (3 missed + 2 regular)
#         and verifying the step 4 summary rows render correctly before confirm.
# Prerequisites: flow 02 (cold launch). Do NOT runFlow setup_wizard — we drive the wizard.
# clearState: false (flow 02 handles it)
appId: com.melnady.qadaa
---
- runFlow: ../flows/02_onboarding_skip.yaml
- assertVisible:
    id: wizard-step1-screen
- tapOn:
    id: wizard-age-input
- eraseText
- inputText: "28"
- tapOn:
    id: wizard-puberty-input
- eraseText
- inputText: "14"
- tapOn:
    point: 50%, 15%
- waitForAnimationToEnd
- tapOn:
    id: wizard-step1-next-btn
- waitForAnimationToEnd
- assertVisible:
    id: wizard-step2-screen
# Toggle advanced, add 2 periods.
- tapOn:
    id: wizard-step2-advanced-btn
- waitForAnimationToEnd
- tapOn:
    id: wizard-add-period-btn
- waitForAnimationToEnd
# Period 0: missed, 3 years.
- tapOn:
    id: wizard-period-0-years-input
- eraseText
- inputText: "3"
- tapOn:
    point: 50%, 15%
- waitForAnimationToEnd
# Period 1: regular, 2 years.
- tapOn:
    id: wizard-period-1-type-regular
- waitForAnimationToEnd
- tapOn:
    id: wizard-period-1-years-input
- eraseText
- inputText: "2"
- tapOn:
    point: 50%, 15%
- waitForAnimationToEnd
- tapOn:
    id: wizard-step2-next-btn
- waitForAnimationToEnd
- assertVisible:
    id: wizard-step3-screen
- tapOn:
    id: wizard-pace-5-btn
- waitForAnimationToEnd
- tapOn:
    id: wizard-step3-next-btn
- waitForAnimationToEnd
- assertVisible:
    id: wizard-step4-screen
# Summary rows and buttons visible.
- assertVisible:
    id: step4-buttons
- assertVisible:
    id: step4-row-0
- assertVisible:
    id: step4-row-1
- tapOn:
    id: wizard-confirm-btn
- extendedWaitUntil:
    visible:
      id: dashboard-screen
    timeout: 20000
- extendedWaitUntil:
    notVisible:
      id: intention-sheet
    timeout: 15000
- assertVisible:
    id: dashboard-screen
