# Flow: 21 - Settings Daily Target Save
# Suite: regression
# Covers: change daily target pace → tap save → saved-feedback state visible.
# Prerequisites: flow 02 (cold launch) + setup_wizard.
# clearState: false (flow 02 handles it)
appId: com.melnady.qadaa
---
- runFlow: ../flows/02_onboarding_skip.yaml
- runFlow: ../utils/setup_wizard.yaml
- tapOn:
    id: tab-settings
    retryTapIfNoChange: true
- waitForAnimationToEnd
- assertVisible:
    id: settings-screen
- assertVisible:
    id: settings-presets-grid
- tapOn:
    id: settings-pace-1-btn
- waitForAnimationToEnd
- tapOn:
    point: 50%, 15%
- waitForAnimationToEnd
- tapOn:
    id: settings-target-save-btn
- waitForAnimationToEnd
- assertVisible:
    id: settings-target-save-btn