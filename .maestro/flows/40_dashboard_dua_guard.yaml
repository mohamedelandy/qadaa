# Flow: 40 - Dashboard DuaModal Guard
# Suite: regression
# Covers: re-logging same day does not re-show DuaModal (Gap M)
# Prerequisites: flow 02 (cold launch) + setup_wizard
# clearState: false (flow 02 handles it)
appId: com.melnady.qadaa
---
- runFlow: ../flows/02_onboarding_skip.yaml
- runFlow: ../utils/setup_wizard.yaml
# Log all 5 prayers to trigger DuaModal
- tapOn:
    id: dashboard-fajr-increment-btn
- waitForAnimationToEnd
- tapOn:
    id: dashboard-dhuhr-increment-btn
- waitForAnimationToEnd
- tapOn:
    id: dashboard-asr-increment-btn
- waitForAnimationToEnd
- tapOn:
    id: dashboard-maghrib-increment-btn
- waitForAnimationToEnd
- tapOn:
    id: dashboard-isha-increment-btn
- waitForAnimationToEnd
- assertVisible:
    id: dua-modal
- tapOn:
    id: dua-close-btn
- waitForAnimationToEnd
- assertNotVisible:
    id: dua-modal
# Re-log a prayer on same day - DuaModal should NOT appear
- tapOn:
    id: dashboard-fajr-increment-btn
- waitForAnimationToEnd
- assertNotVisible:
    id: dua-modal