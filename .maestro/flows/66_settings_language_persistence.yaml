# Flow: 66 - Language Persistence
# Covers: switching the UI to English then terminating/relaunching (no
#         clearState) keeps the app in English — English settings strings are
#         visible after the cold start.
# Prerequisites: flow 02 (cold launch) + setup_wizard.
appId: com.melnady.qadaa
---
- runFlow: ../flows/02_onboarding_skip.yaml
- runFlow: ../utils/setup_wizard.yaml
- tapOn:
    id: tab-settings
    retryTapIfNoChange: true
- waitForAnimationToEnd
- assertVisible:
    id: settings-screen
# Toggle to English (app stays on Settings).
- tapOn:
    id: settings-lang-en-btn
- waitForAnimationToEnd
# App stays on Settings after language toggle — verify settings is still visible.
- assertVisible:
    id: settings-screen
# Terminate and relaunch WITHOUT clearState — English must survive.
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: dashboard-screen
    timeout: 15000
- waitForAnimationToEnd
- tapOn:
    id: tab-settings
    retryTapIfNoChange: true
- waitForAnimationToEnd
# English-only settings strings prove the language persisted (not Arabic).
- extendedWaitUntil:
    visible:
      text: "Language"
    timeout: 10000
- assertVisible:
    text: "Daily Pace"
