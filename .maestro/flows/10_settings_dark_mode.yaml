# Flow: 10 - Settings Dark Mode
# Suite: regression
# Covers: toggle dark mode on and off; verifies no crash (colors are not assertable by Maestro).
# Prerequisites: flow 02 (cold launch) + setup_wizard.
# clearState: false (flow 02 handles it)
appId: com.melnady.qadaa
---
- runFlow: ../flows/02_onboarding_skip.yaml
- runFlow: ../utils/setup_wizard.yaml
- tapOn:
    id: tab-settings
    retryTapIfNoChange: true
- waitForAnimationToEnd
- assertVisible:
    id: settings-theme-toggle
- tapOn:
    id: settings-theme-toggle
- waitForAnimationToEnd
- assertVisible:
    id: settings-screen
- tapOn:
    id: settings-theme-toggle
- waitForAnimationToEnd
- assertVisible:
    id: settings-screen