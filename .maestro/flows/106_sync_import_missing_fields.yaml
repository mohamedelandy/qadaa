# Flow: 106 - Sync Import Missing Required Fields
# Suite: regression
# Covers: pasting valid JSON that is missing the required "prayers" key shows
#         the import error (zod validation rejects the structurally incomplete payload).
# Prerequisites: flow 02 (cold launch) + setup_wizard.
# clearState: false (flow 02 handles it)
appId: com.melnady.qadaa
---
- runFlow: ../flows/02_onboarding_skip.yaml
- runFlow: ../utils/setup_wizard.yaml
- tapOn:
    id: tab-settings
    retryTapIfNoChange: true
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: settings-sync-btn
    direction: DOWN
- tapOn:
    id: settings-sync-btn
- waitForAnimationToEnd
- tapOn:
    id: sync-tab-import
- waitForAnimationToEnd
- tapOn:
    id: sync-paste-input
# Valid JSON but missing the required "prayers" key.
- inputText: '{"version":1,"wizardComplete":true,"age":28,"pubertyAge":14,"periods":[],"totalMissedDays":0,"streak":0,"lastLogDate":null,"daysLogged":0,"loggedDates":[],"points":0,"badges":[],"language":"en","notificationTime":null,"notificationPermission":"default"}'
# Swipe down to dismiss the keyboard, then tap the import button.
- swipe:
    start: 50%, 80%
    end: 50%, 20%
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: sync-import-btn
    timeout: 5000
- tapOn:
    id: sync-import-btn
- extendedWaitUntil:
    visible:
      id: sync-import-error
    timeout: 10000
- assertVisible:
    id: sync-import-error
- assertNotVisible:
    id: sync-import-success
- tapOn:
    id: sync-close-btn
    optional: true
- waitForAnimationToEnd
- swipe:
    start: 50%, 90%
    end: 50%, 10%
- waitForAnimationToEnd
- assertVisible:
    id: settings-screen
