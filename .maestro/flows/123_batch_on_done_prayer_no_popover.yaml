# Flow: 123 - Batch on Done Prayer (No Popover)
# Suite: regression
# Covers: long-pressing the increment button on a prayer where all units are
#         recovered (isDone=true) should NOT open the batch popover — the
#         handleLongPress guard checks remaining > 0.
# Uses new testIDs: dashboard-fajr-progress-label
# Prerequisites: flow 02 (cold launch) + setup_wizard.
# clearState: false (flow 02 handles it)
appId: com.melnady.qadaa
---
- runFlow: ../flows/02_onboarding_skip.yaml
- runFlow: ../utils/setup_wizard.yaml
- runScript:
    file: ../utils/batch_one_state_payload.js
- tapOn:
    id: tab-settings
    retryTapIfNoChange: true
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: settings-sync-btn
    direction: DOWN
- tapOn:
    id: settings-sync-btn
- waitForAnimationToEnd
- tapOn:
    id: sync-tab-import
- waitForAnimationToEnd
- tapOn:
    id: sync-paste-input
- inputText: ${output.payload}
- swipe:
    start: 50%, 80%
    end: 50%, 20%
- waitForAnimationToEnd
- tapOn:
    id: sync-import-btn
- waitForAnimationToEnd
- tapOn:
    id: sync-close-btn
    optional: true
- waitForAnimationToEnd
- swipe:
    start: 50%, 90%
    end: 50%, 10%
- waitForAnimationToEnd
# The import returns to settings; scroll to the top to reveal the tab bar.
- swipe:
    start: 50%, 20%
    end: 50%, 90%
- waitForAnimationToEnd
- tapOn:
    id: tab-dashboard
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: dashboard-screen
    timeout: 10000
# Log all 1 fajr prayer to make isDone=true.
- tapOn:
    id: dashboard-fajr-increment-btn
- waitForAnimationToEnd
# Verify progress shows 100% (all recovered).
- scrollUntilVisible:
    element:
      id: dashboard-fajr-progress-label
    direction: DOWN
- copyTextFrom:
    id: dashboard-fajr-progress-label
- assertTrue: "${maestro.copiedText.includes('100%')}"
# Long-press on done prayer → batch popover should NOT appear.
- longPressOn:
    id: dashboard-fajr-increment-btn
- waitForAnimationToEnd
- assertNotVisible:
    id: batch-preset-5-btn
- assertNotVisible:
    id: batch-custom-btn
# The increment button should show checkmark (done state).
- assertVisible:
    id: dashboard-fajr-increment-btn
