# Flow: 22 - Settings Notification Picker
# Suite: regression
# Covers: hour-up x2, minute-0 select, notification-save-btn tap; settings-screen must survive.
# Prerequisites: flow 02 (cold launch) + setup_wizard.
# clearState: false (flow 02 handles it)
appId: com.melnady.qadaa
---
- runFlow: ../flows/02_onboarding_skip.yaml
- runFlow: ../utils/setup_wizard.yaml
- tapOn:
    id: tab-settings
    retryTapIfNoChange: true
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: hour-up
    direction: DOWN
- assertVisible:
    id: hour-down
- tapOn:
    id: hour-up
- waitForAnimationToEnd
- tapOn:
    id: hour-up
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: settings-minute-00
    direction: DOWN
- tapOn:
    id: settings-minute-00
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: notification-save-btn
    direction: UP
- tapOn:
    id: notification-save-btn
- waitForAnimationToEnd
- tapOn:
    id: tab-settings
    retryTapIfNoChange: true
- waitForAnimationToEnd
- assertVisible:
    id: settings-screen