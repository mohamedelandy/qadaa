# Flow: 102 - Rapid Language Toggle
# Suite: regression
# Covers: toggling language 3 times in rapid succession (ar→en→ar→en) to verify
#         the rtlKey remount doesn't race or crash.
# Prerequisites: flow 02 (cold launch) + setup_wizard.
# clearState: false (flow 02 handles it)
appId: com.melnady.qadaa
---
- runFlow: ../flows/02_onboarding_skip.yaml
- runFlow: ../utils/setup_wizard.yaml
- tapOn:
    id: tab-settings
    retryTapIfNoChange: true
- waitForAnimationToEnd
# Toggle ar → en.
- tapOn:
    id: settings-lang-en-btn
- waitForAnimationToEnd
# Re-navigate to settings after remount.
- tapOn:
    id: tab-settings
    retryTapIfNoChange: true
- waitForAnimationToEnd
# Toggle en → ar.
- tapOn:
    id: settings-lang-ar-btn
- waitForAnimationToEnd
# Re-navigate to settings after remount.
- tapOn:
    id: tab-settings
    retryTapIfNoChange: true
- waitForAnimationToEnd
# Toggle ar → en again.
- tapOn:
    id: settings-lang-en-btn
- waitForAnimationToEnd
# Re-navigate to settings — should be in English.
- tapOn:
    id: tab-settings
    retryTapIfNoChange: true
- waitForAnimationToEnd
- assertVisible:
    id: settings-screen
- assertVisible:
    text: "Language"
