# Flow: 31 - Settings Reset
# Suite: regression
# Covers: cancel keeps data; confirm wipes store and returns to wizard step 1.
# Prerequisites: flow 02 (cold launch) + setup_wizard.
# clearState: false (flow 02 handles it)
# Note: after resetAll() the tabs guard redirects to /wizard (wizardComplete=false),
# so we assert wizard-step1-screen. Do NOT add a second launchApp/clearState.
appId: com.melnady.qadaa
---
- runFlow: ../flows/02_onboarding_skip.yaml
- runFlow: ../utils/setup_wizard.yaml
- tapOn:
    id: tab-settings
    retryTapIfNoChange: true
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: reset-btn
    direction: DOWN
- swipe:
    start: 50%, 70%
    end: 50%, 50%
    duration: 300
- waitForAnimationToEnd
- tapOn:
    id: reset-btn
- waitForAnimationToEnd
- assertVisible:
    id: reset-confirm
- tapOn:
    id: reset-cancel-btn
- waitForAnimationToEnd
- assertNotVisible:
    id: reset-confirm
- scrollUntilVisible:
    element:
      id: reset-btn
    direction: DOWN
- swipe:
    start: 50%, 70%
    end: 50%, 50%
    duration: 300
- waitForAnimationToEnd
- tapOn:
    id: reset-btn
- waitForAnimationToEnd
- tapOn:
    id: reset-confirm
- waitForAnimationToEnd
- assertVisible:
    id: wizard-step1-screen