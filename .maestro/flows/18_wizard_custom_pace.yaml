# Flow: 18 - Wizard Custom Pace
# Suite: regression
# Covers: step 3 custom-pace branch — wizard-pace-custom-btn + wizard-pace-custom-input.
# Prerequisites: flow 02 (cold launch). Do NOT runFlow setup_wizard — we drive the wizard.
# clearState: false (flow 02 handles it)
appId: com.melnady.qadaa
---
- runFlow: ../flows/02_onboarding_skip.yaml
- assertVisible:
    id: wizard-step1-screen
- tapOn:
    id: wizard-age-input
- eraseText
- inputText: "28"
- tapOn:
    id: wizard-puberty-input
- eraseText
- inputText: "14"
- tapOn:
    point: 50%, 15%
- waitForAnimationToEnd
- tapOn:
    id: wizard-step1-next-btn
- waitForAnimationToEnd
- tapOn:
    id: wizard-years-quick-input
- eraseText
- inputText: "5"
- tapOn:
    point: 50%, 15%
- waitForAnimationToEnd
- tapOn:
    id: wizard-step2-next-btn
- waitForAnimationToEnd
- assertVisible:
    id: wizard-step3-screen
- tapOn:
    id: wizard-pace-custom-btn
- waitForAnimationToEnd
- assertVisible:
    id: wizard-pace-custom-input
- inputText: "7"
- tapOn:
    text: "Daily Pace"
- waitForAnimationToEnd
- tapOn:
    id: wizard-step3-next-btn
- waitForAnimationToEnd
- assertVisible:
    id: wizard-step4-screen
- tapOn:
    id: wizard-confirm-btn
# The intention sheet auto-confirms after ~4s — wait deterministically for the
# dashboard to mount, then for the sheet to close itself.
- extendedWaitUntil:
    visible:
      id: dashboard-screen
    timeout: 20000
- extendedWaitUntil:
    notVisible:
      id: intention-sheet
    timeout: 15000
- assertVisible:
    id: dashboard-screen