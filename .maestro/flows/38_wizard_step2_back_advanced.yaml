# Flow: 38 - Wizard Step 2 Back from Advanced Mode
# Suite: regression
# Covers: back from step 2 advanced preserves periods and state
# Prerequisites: flow 02 (cold launch). Do NOT runFlow setup_wizard — we drive the wizard.
# clearState: false (flow 02 handles it)
appId: com.melnady.qadaa
---
- runFlow: ../flows/02_onboarding_skip.yaml
- assertVisible:
    id: wizard-step1-screen
- tapOn:
    id: wizard-age-input
- eraseText
- inputText: "28"
- tapOn:
    id: wizard-puberty-input
- eraseText
- inputText: "14"
- tapOn:
    point: 50%, 15%
- waitForAnimationToEnd
- tapOn:
    id: wizard-step1-next-btn
- waitForAnimationToEnd
- assertVisible:
    id: wizard-step2-screen
- tapOn:
    id: wizard-step2-advanced-btn
- waitForAnimationToEnd
- assertVisible:
    id: wizard-add-period-btn
- tapOn:
    id: wizard-add-period-btn
- waitForAnimationToEnd
- tapOn:
    id: wizard-period-0-years-input
- eraseText
- inputText: "3"
- tapOn:
    point: 50%, 15%
- waitForAnimationToEnd
- tapOn:
    id: wizard-step1-back-btn
- waitForAnimationToEnd
- assertVisible:
    id: wizard-step1-screen
- tapOn:
    id: wizard-step1-next-btn
- waitForAnimationToEnd
- assertVisible:
    id: wizard-step2-screen
# Advanced mode + periods are preserved after back-nav (no toggle needed)
- assertVisible:
    id: wizard-period-0-years-input
- assertVisible:
    id: wizard-step2-meter
- tapOn:
    id: wizard-step2-next-btn
- waitForAnimationToEnd
- assertVisible:
    id: wizard-step3-screen