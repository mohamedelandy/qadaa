# Flow: 85 - Settings Feedback Button Reachable
# Suite: regression
# Covers: the feedback button in the settings screen is tappable; it opens an
#         external URL (Google Forms) which Maestro cannot verify, so we assert
#         the button is visible and the settings screen survives the tap.
# Prerequisites: flow 02 (cold launch) + setup_wizard.
# clearState: false (flow 02 handles it)
appId: com.melnady.qadaa
---
- runFlow: ../flows/02_onboarding_skip.yaml
- runFlow: ../utils/setup_wizard.yaml
- tapOn:
    id: tab-settings
    retryTapIfNoChange: true
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: settings-feedback-btn
    direction: DOWN
- assertVisible:
    id: settings-feedback-btn
- tapOn:
    id: settings-feedback-btn
    point: 50%, 30%
- waitForAnimationToEnd
# Linking opens an external browser; the app's foreground state is platform-dependent.
