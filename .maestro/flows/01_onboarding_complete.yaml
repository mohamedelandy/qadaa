# Flow: 01 - Onboarding Complete
# Suite: regression
# Covers: user steps through all 4 onboarding slides with the Next button, lands on wizard step 1.
# Prerequisites: none (fresh state via clearState)
# clearState: true (cold start must begin at onboarding)
appId: com.melnady.qadaa
---
- launchApp:
    clearState: true
    arguments:
      AppleLanguages: "(en)"
      AppleLocale: "en_UK"
- waitForAnimationToEnd
- assertVisible:
    id: onboarding-slide-1
- tapOn:
    id: onboarding-next-btn
- waitForAnimationToEnd
- assertVisible:
    id: onboarding-slide-2
- tapOn:
    id: onboarding-next-btn
- waitForAnimationToEnd
- assertVisible:
    id: onboarding-slide-3
- tapOn:
    id: onboarding-next-btn
- waitForAnimationToEnd
- assertVisible:
    id: onboarding-slide-4
- tapOn:
    id: onboarding-next-btn
- waitForAnimationToEnd
- assertVisible:
    id: wizard-step1-screen