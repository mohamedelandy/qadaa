# Flow: 69 - Sync Export Verification
# Suite: regression
# Covers: verifying the export clipboard tab shows copy button + JSON preview.
#         Import is already tested by flow 28. copyTextFrom truncates long JSON
#         and inputText truncates ~500+ char strings, so roundtrip is unreliable.
#         Also verifies QR tab renders.
# Prerequisites: flow 02 (cold launch) + setup_wizard.
# clearState: false (flow 02 handles it)
appId: com.melnady.qadaa
---
- runFlow: ../flows/02_onboarding_skip.yaml
- runFlow: ../utils/setup_wizard.yaml
- tapOn:
    id: tab-settings
    retryTapIfNoChange: true
- waitForAnimationToEnd
- assertVisible:
    id: settings-screen
- scrollUntilVisible:
    element:
      id: settings-sync-btn
    direction: DOWN
- tapOn:
    id: settings-sync-btn
- waitForAnimationToEnd
# --- Export side: verify clipboard tab shows copy button + preview ---
- tapOn:
    id: sync-tab-clipboard
- waitForAnimationToEnd
- assertVisible:
    id: sync-copy-btn
- tapOn:
    id: sync-copy-btn
- waitForAnimationToEnd
- assertVisible:
    id: sync-preview-json
# --- Verify QR tab also works ---
- tapOn:
    id: sync-tab-qr
- waitForAnimationToEnd
- assertVisible:
    id: sync-qr-container
# --- Done — sync sheet stays open, next flow will relaunch ---
