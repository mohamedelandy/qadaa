# Flow: 17 - Wizard Back Navigation
# Suite: regression
# Covers: back-nav through wizard steps 4→3→2→1; ensures back btn is wired correctly.
# Prerequisites: flow 02 (cold launch). Do NOT runFlow setup_wizard — we drive the wizard.
# clearState: false (flow 02 handles it)
appId: com.melnady.qadaa
---
- runFlow: ../flows/02_onboarding_skip.yaml
- assertVisible:
    id: wizard-step1-screen
- tapOn:
    id: wizard-age-input
- eraseText
- inputText: "28"
- tapOn:
    id: wizard-puberty-input
- eraseText
- inputText: "14"
- tapOn:
    point: 50%, 15%
- waitForAnimationToEnd
- tapOn:
    id: wizard-step1-next-btn
- waitForAnimationToEnd
- assertVisible:
    id: wizard-step2-screen
- tapOn:
    id: wizard-years-quick-input
- eraseText
- inputText: "5"
- tapOn:
    point: 50%, 15%
- waitForAnimationToEnd
- tapOn:
    id: wizard-step2-next-btn
- waitForAnimationToEnd
- assertVisible:
    id: wizard-step3-screen
- tapOn:
    id: wizard-pace-5-btn
- waitForAnimationToEnd
- tapOn:
    id: wizard-step3-next-btn
- waitForAnimationToEnd
- assertVisible:
    id: wizard-step4-screen
# Back 4→3 (Step4Summary back button)
- tapOn:
    id: wizard-step4-back-btn
- waitForAnimationToEnd
- assertVisible:
    id: wizard-step3-screen
# Back 3→2 (nav back, currentStep=2)
- tapOn:
    id: wizard-step2-back-btn
- waitForAnimationToEnd
- assertVisible:
    id: wizard-step2-screen
# Back 2→1 (nav back, currentStep=1)
- tapOn:
    id: wizard-step1-back-btn
- waitForAnimationToEnd
- assertVisible:
    id: wizard-step1-screen
