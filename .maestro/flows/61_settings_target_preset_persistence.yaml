# Flow: 61 - Settings Daily Target Preset Persistence
# Suite: regression
# Covers: saving a PRESET daily target (1 then 10) in settings persists to the
#         dashboard hero pill (0/1 then 0/10). Flow 21 saved pace-1 but never
#         verified the dashboard; flow 44 only covered the custom path (0/3).
#         Also covers the never-tapped settings-pace-10-btn.
# Prerequisites: flow 02 (cold launch) + setup_wizard (default target 5).
# clearState: false (flow 02 handles it)
appId: com.melnady.qadaa
---
- runFlow: ../flows/02_onboarding_skip.yaml
- runFlow: ../utils/setup_wizard.yaml
# --- Preset 1 → dashboard pill reads 0/1 ---
- tapOn:
    id: tab-settings
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: settings-screen
    timeout: 10000
- scrollUntilVisible:
    element:
      id: settings-presets-grid
    direction: DOWN
- assertVisible:
    id: settings-pace-1-btn
- tapOn:
    id: settings-pace-1-btn
- waitForAnimationToEnd
- tapOn:
    id: settings-target-save-btn
- waitForAnimationToEnd
- tapOn:
    id: tab-dashboard
    retryTapIfNoChange: true
- waitForAnimationToEnd
- assertVisible:
    id: dashboard-screen
- assertVisible: "0/1"
# --- Preset 10 → dashboard pill reads 0/10 ---
- tapOn:
    id: tab-settings
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: settings-screen
    timeout: 10000
- scrollUntilVisible:
    element:
      id: settings-presets-grid
    direction: DOWN
- tapOn:
    id: settings-pace-10-btn
- waitForAnimationToEnd
- tapOn:
    id: settings-target-save-btn
- waitForAnimationToEnd
- tapOn:
    id: tab-dashboard
    retryTapIfNoChange: true
- waitForAnimationToEnd
- assertVisible:
    id: dashboard-screen
- assertVisible: "0/10"
