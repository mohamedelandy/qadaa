# Flow: 86 - Settings Appearance Section Labels
# Suite: regression
# Covers: the appearance toggle label reads "Dark Mode" in light mode and
#         "Light Mode" in dark mode.
# Prerequisites: flow 02 (cold launch) + setup_wizard.
# clearState: false (flow 02 handles it)
appId: com.melnady.qadaa
---
- runFlow: ../flows/02_onboarding_skip.yaml
- runFlow: ../utils/setup_wizard.yaml
- tapOn:
    id: tab-settings
    retryTapIfNoChange: true
- waitForAnimationToEnd
- assertVisible:
    id: settings-screen
- scrollUntilVisible:
    element:
      id: settings-theme-toggle
    direction: DOWN
- assertVisible:
    id: settings-theme-toggle
# Default is light mode → button offers dark mode label.
- copyTextFrom:
    id: settings-theme-toggle
- assertTrue: "${maestro.copiedText.includes('Dark Mode')}"
# Toggle to dark mode → button flips to light mode label.
- tapOn:
    id: settings-theme-toggle
- waitForAnimationToEnd
- copyTextFrom:
    id: settings-theme-toggle
- assertTrue: "${maestro.copiedText.includes('Light Mode')}"
# Toggle back to light mode.
- tapOn:
    id: settings-theme-toggle
- waitForAnimationToEnd
- assertVisible:
    id: settings-screen
