# Flow: 60 - Notification Minute Variants
# Suite: regression
# Covers: the 15/30/45 minute options in the notification picker are tappable,
#         each save persists across remounts (permission pre-granted → no
#         prompt), and the picker re-selects the saved minute (selected state).
#         Flows 22/53 only ever selected 00.
# Prerequisites: none (standalone — own launchApp with clearState + permission grant)
# clearState: true (cold start; do NOT runFlow 02 — it would double-launch)
appId: com.melnady.qadaa
---
- launchApp:
    clearState: true
    arguments:
      AppleLanguages: "(en)"
      AppleLocale: "en_UK"
    permissions:
      notifications: granted
- waitForAnimationToEnd
- assertVisible:
    id: onboarding-slide-1
- tapOn:
    id: onboarding-skip-btn
- waitForAnimationToEnd
- runFlow: ../utils/setup_wizard.yaml
- tapOn:
    id: tab-settings
    retryTapIfNoChange: true
- waitForAnimationToEnd
- assertVisible:
    id: settings-screen
# --- Minute 15: select, save, re-mount → 15 stays selected ---
- scrollUntilVisible:
    element:
      id: settings-minute-15
    direction: DOWN
- tapOn:
    id: settings-minute-15
- waitForAnimationToEnd
- tapOn:
    id: notification-save-btn
- waitForAnimationToEnd
- tapOn:
    id: tab-dashboard
    retryTapIfNoChange: true
- waitForAnimationToEnd
- tapOn:
    id: tab-settings
    retryTapIfNoChange: true
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: settings-minute-15
    direction: DOWN
- assertVisible:
    id: settings-minute-15
    selected: true
# --- Minute 30: select, save, re-mount → 30 stays selected ---
- tapOn:
    id: settings-minute-30
- waitForAnimationToEnd
- tapOn:
    id: notification-save-btn
- waitForAnimationToEnd
- tapOn:
    id: tab-dashboard
    retryTapIfNoChange: true
- waitForAnimationToEnd
- tapOn:
    id: tab-settings
    retryTapIfNoChange: true
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: settings-minute-30
    direction: DOWN
- assertVisible:
    id: settings-minute-30
    selected: true
- assertVisible:
    id: settings-minute-15
    selected: false
# --- Minute 45: select, save, re-mount → 45 stays selected ---
- tapOn:
    id: settings-minute-45
- waitForAnimationToEnd
- tapOn:
    id: notification-save-btn
- waitForAnimationToEnd
- tapOn:
    id: tab-dashboard
    retryTapIfNoChange: true
- waitForAnimationToEnd
- tapOn:
    id: tab-settings
    retryTapIfNoChange: true
- waitForAnimationToEnd
- assertVisible:
    id: settings-screen
- scrollUntilVisible:
    element:
      id: settings-minute-45
    direction: DOWN
- assertVisible:
    id: settings-minute-45
    selected: true
- assertVisible:
    id: notification-hour-value
