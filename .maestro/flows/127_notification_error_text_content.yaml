# Flow: 127 - Notification Error Text Content
# Suite: regression
# Covers: when notifications permission is DENIED and the user taps save, the
#         notification-error element appears AND its text content matches the
#         expected translation (not just element visibility). Flow 67 asserts
#         the element exists; this flow verifies the actual error message text.
# Prerequisites: none (standalone — own launchApp with clearState + permission deny)
# clearState: true (cold start; do NOT runFlow 02 — it would double-launch)
appId: com.melnady.qadaa
---
- launchApp:
    clearState: true
    arguments:
      AppleLanguages: "(en)"
      AppleLocale: "en_UK"
    permissions:
      notifications: denied
- waitForAnimationToEnd
- assertVisible:
    id: onboarding-slide-1
- tapOn:
    id: onboarding-skip-btn
- waitForAnimationToEnd
- runFlow: ../utils/setup_wizard.yaml
- tapOn:
    id: tab-settings
    retryTapIfNoChange: true
- waitForAnimationToEnd
- assertVisible:
    id: settings-screen
- scrollUntilVisible:
    element:
      id: notification-save-btn
    direction: DOWN
- tapOn:
    id: notification-save-btn
- waitForAnimationToEnd
# Error element appears after the denied permission result resolves.
- extendedWaitUntil:
    visible:
      id: notification-error
    timeout: 10000
- copyTextFrom:
    id: notification-error
- assertTrue: "${maestro.copiedText.length > 0}"
# The picker survives the error — no crash.
- assertVisible:
    id: notification-hour-value
- assertVisible:
    id: settings-screen
