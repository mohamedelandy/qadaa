# Flow: 119 - Wizard Step 1 Empty Input Validation
# Suite: regression
# Covers: leaving the age and puberty age inputs empty shows validation errors
#         and keeps Next disabled.
# Prerequisites: flow 02 (cold launch). Do NOT runFlow setup_wizard — we drive the wizard.
# clearState: false (flow 02 handles it)
appId: com.melnady.qadaa
---
- runFlow: ../flows/02_onboarding_skip.yaml
- assertVisible:
    id: wizard-step1-screen
# Fill valid values first so eraseText triggers onChange validation.
- tapOn:
    id: wizard-age-input
- inputText: "28"
- tapOn:
    id: wizard-puberty-input
- inputText: "14"
- tapOn:
    point: 50%, 15%
- waitForAnimationToEnd
# Clear both inputs → validation fires on change.
- tapOn:
    id: wizard-age-input
- eraseText
- tapOn:
    id: wizard-puberty-input
- eraseText
- tapOn:
    point: 50%, 15%
- waitForAnimationToEnd
# Empty inputs → error visible, Next disabled.
- assertVisible:
    id: wizard-step1-error
- assertVisible:
    id: wizard-step1-next-btn
    enabled: false
# Fill valid values → error clears, Next advances.
- tapOn:
    id: wizard-age-input
- inputText: "28"
- tapOn:
    id: wizard-puberty-input
- inputText: "14"
- tapOn:
    point: 50%, 15%
- waitForAnimationToEnd
- assertNotVisible:
    id: wizard-step1-error
- tapOn:
    id: wizard-step1-next-btn
- waitForAnimationToEnd
- assertVisible:
    id: wizard-step2-screen
