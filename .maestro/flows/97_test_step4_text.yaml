# Flow: 97 - Wizard Step 4 Summary Text
# Suite: regression
# Covers: driving the wizard manually to step 4 and screenshotting the summary
#         text (Arabic summary is verified visually via the screenshot;
#         assertions use testIDs — Arabic text selectors are banned).
# Prerequisites: flow 02 (cold launch). Do NOT runFlow setup_wizard — we drive the wizard.
# clearState: false (flow 02 handles it)
appId: com.melnady.qadaa
---
- runFlow: ../flows/02_onboarding_skip.yaml
- assertVisible:
    id: wizard-step1-screen
- tapOn:
    id: wizard-age-input
- eraseText
- inputText: "28"
- tapOn:
    id: wizard-puberty-input
- eraseText
- inputText: "14"
- tapOn:
    point: 50%, 15%
- waitForAnimationToEnd
- tapOn:
    id: wizard-step1-next-btn
- waitForAnimationToEnd
- assertVisible:
    id: wizard-step2-screen
- tapOn:
    id: wizard-years-quick-input
- eraseText
- inputText: "5"
- tapOn:
    point: 50%, 15%
- waitForAnimationToEnd
- tapOn:
    id: wizard-step2-next-btn
- waitForAnimationToEnd
- assertVisible:
    id: wizard-step3-screen
- tapOn:
    id: wizard-pace-5-btn
- waitForAnimationToEnd
- tapOn:
    id: wizard-step3-next-btn
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: wizard-step4-screen
    timeout: 10000
- assertVisible:
    id: step4-row-0
- takeScreenshot: wizard-step4-text-check
