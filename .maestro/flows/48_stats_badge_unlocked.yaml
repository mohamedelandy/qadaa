# Flow: 48 - Stats Badge Grid (Unlocked Badge After Import)
# Suite: regression
# Covers: importing a backup that carries an already-earned badge (warrior_30)
#         renders it UNLOCKED on the badge grid (unlock date shown), while a badge
#         absent from the backup (golden_year) renders LOCKED.
# Prerequisites: flow 02 (cold launch) + setup_wizard.
# clearState: false (flow 02 handles it)
appId: com.melnady.qadaa
---
- runFlow: ../flows/02_onboarding_skip.yaml
- runFlow: ../utils/setup_wizard.yaml
- tapOn:
    id: tab-settings
    retryTapIfNoChange: true
- waitForAnimationToEnd
- assertVisible:
    id: settings-screen
- scrollUntilVisible:
    element:
      id: settings-sync-btn
    direction: DOWN
- tapOn:
    id: settings-sync-btn
- waitForAnimationToEnd
- tapOn:
    id: sync-tab-import
- waitForAnimationToEnd
- tapOn:
    id: sync-paste-input
# Backup carrying the warrior_30 badge (streak 30 is consistent with it being earned).
- inputText:
    text: '{"version":1,"wizardComplete":true,"age":28,"pubertyAge":14,"periods":[{"type":"missed","years":1}],"totalMissedDays":3650,"prayers":{"fajr":{"recovered":0},"dhuhr":{"recovered":0},"asr":{"recovered":0},"maghrib":{"recovered":0},"isha":{"recovered":0}},"todayPrayers":{},"todayLogPoints":{},"todayUnits":{},"todayDate":null,"streak":30,"lastLogDate":null,"daysLogged":30,"loggedDates":[],"points":100,"badges":[{"id":"warrior_30","unlockedAt":1750000000000}],"language":"en","notificationTime":null,"notificationPermission":"default","graceUsedMonth":null,"lastDuaShownDate":null,"intentionSetDate":null,"dailyTarget":5}'
# Swipe down to dismiss the keyboard, then tap the import button.
- swipe:
    start: 50%, 80%
    end: 50%, 20%
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: sync-import-btn
    timeout: 5000
- tapOn:
    id: sync-import-btn
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: sync-import-success
    timeout: 5000
- tapOn:
    id: sync-close-btn
    optional: true
- waitForAnimationToEnd
- swipe:
    start: 50%, 90%
    end: 50%, 10%
- waitForAnimationToEnd
- assertVisible:
    id: settings-screen

