# Flow: 08 - Stats Screen
# Suite: regression
# Covers: after logging one prayer, verify streak/level/rank/estimate card and all 8 badge cells render
#         (locked variants included); the estimate card shows its no-data state
#         (daysLogged < 3 → no figures).
# Note: `stats-estimate-text` is on the estimate CARD (always present). The estimate figures only appear
# after 3 distinct log dates, which one cold-launch session cannot produce.
# Prerequisites: flow 02 (cold launch) + setup_wizard.
# clearState: false (flow 02 handles it)
appId: com.melnady.qadaa
---
- runFlow: ../flows/02_onboarding_skip.yaml
- runFlow: ../utils/setup_wizard.yaml
- tapOn:
    id: dashboard-fajr-increment-btn
- waitForAnimationToEnd
- tapOn:
    id: tab-stats
    retryTapIfNoChange: true
- waitForAnimationToEnd
- assertVisible:
    id: stats-screen
- assertVisible:
    id: stats-streak-count
- assertVisible:
    id: stats-level-count
- scrollUntilVisible:
    element:
      id: stats-rank-text
    direction: DOWN
- assertVisible:
    id: stats-rank-text
- scrollUntilVisible:
    element:
      id: stats-estimate-text
    direction: DOWN
- assertVisible:
    id: stats-estimate-text
# Only one log date so far → estimate shows no-data (no figures below 3 days).
- assertNotVisible:
    id: stats-estimate-years
- assertNotVisible:
    id: stats-estimate-pace
- scrollUntilVisible:
    element:
      id: stats-badge-first_log
    direction: DOWN
- assertVisible:
    id: stats-badge-first_log
- assertVisible:
    id: stats-badge-first_week
- assertVisible:
    id: stats-badge-warrior_30
- assertVisible:
    id: stats-badge-golden_year
- scrollUntilVisible:
    element:
      id: stats-badge-quarter_way
    direction: DOWN
- assertVisible:
    id: stats-badge-quarter_way
- assertVisible:
    id: stats-badge-quarter_way-locked
- assertVisible:
    id: stats-badge-halfway
- assertVisible:
    id: stats-badge-halfway-locked
- assertVisible:
    id: stats-badge-almost_there
- assertVisible:
    id: stats-badge-almost_there-locked
- scrollUntilVisible:
    element:
      id: stats-badge-complete
    direction: DOWN
- assertVisible:
    id: stats-badge-complete
- assertVisible:
    id: stats-badge-complete-locked