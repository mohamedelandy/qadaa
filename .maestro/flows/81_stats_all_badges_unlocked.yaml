# Flow: 81 - Stats All Badges Unlocked
# Suite: regression
# Covers: importing a backup with all 8 badges earned renders every badge UNLOCKED
#         on the badge grid (no locked badges remaining, all show unlock dates).
# Prerequisites: flow 02 (cold launch) + setup_wizard.
# clearState: false (flow 02 handles it)
appId: com.melnady.qadaa
---
- runFlow: ../flows/02_onboarding_skip.yaml
- runFlow: ../utils/setup_wizard.yaml
- tapOn:
    id: tab-settings
    retryTapIfNoChange: true
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: settings-sync-btn
    direction: DOWN
- tapOn:
    id: settings-sync-btn
- waitForAnimationToEnd
- tapOn:
    id: sync-tab-import
- waitForAnimationToEnd
- tapOn:
    id: sync-paste-input
- inputText:
    text: '{"version":1,"wizardComplete":true,"age":28,"pubertyAge":14,"periods":[{"type":"missed","years":1}],"totalMissedDays":3650,"prayers":{"fajr":{"recovered":100},"dhuhr":{"recovered":0},"asr":{"recovered":0},"maghrib":{"recovered":0},"isha":{"recovered":0}},"streak":365,"lastLogDate":null,"daysLogged":365,"loggedDates":[],"points":6000,"badges":[{"id":"first_log","unlockedAt":1750000000000},{"id":"first_week","unlockedAt":1750000000000},{"id":"warrior_30","unlockedAt":1750000000000},{"id":"golden_year","unlockedAt":1750000000000},{"id":"quarter_way","unlockedAt":1750000000000},{"id":"halfway","unlockedAt":1750000000000},{"id":"almost_there","unlockedAt":1750000000000},{"id":"complete","unlockedAt":1750000000000}],"language":"en"}'
# Swipe down to dismiss the keyboard, then tap the import button.
- swipe:
    start: 50%, 80%
    end: 50%, 20%
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: sync-import-btn
    timeout: 5000
- tapOn:
    id: sync-import-btn
    optional: true
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: sync-import-success
    timeout: 5000
- tapOn:
    id: sync-close-btn
    optional: true
- waitForAnimationToEnd
- swipe:
    start: 50%, 90%
    end: 50%, 10%

