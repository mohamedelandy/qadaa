# Flow: 111 - Batch Custom Input Zero
# Suite: regression
# Covers: entering "0" in the batch custom input and confirming — no prayers
#         should be logged (no undo button appears, no points awarded).
# Prerequisites: flow 02 (cold launch) + setup_wizard.
# clearState: false (flow 02 handles it)
appId: com.melnady.qadaa
---
- runFlow: ../flows/02_onboarding_skip.yaml
- runFlow: ../utils/setup_wizard.yaml
- scrollUntilVisible:
    element:
      id: dashboard-fajr-increment-btn
    direction: DOWN
- longPressOn:
    id: dashboard-fajr-increment-btn
- waitForAnimationToEnd
- assertVisible:
    id: batch-preset-5-btn
- tapOn:
    id: batch-custom-btn
- waitForAnimationToEnd
- assertVisible:
    id: batch-custom-input
- tapOn:
    id: batch-custom-input
- inputText: "0"
- tapOn:
    point: 50%, 15%
- waitForAnimationToEnd
- tapOn:
    id: batch-custom-confirm-btn
- waitForAnimationToEnd
# 0 prayers logged → no undo button, no points.
- assertNotVisible:
    id: dashboard-fajr-undo-btn
