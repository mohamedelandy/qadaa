# Flow: 130 - Grace Day Previous Month Available
# Suite: regression
# Covers: importing a backup whose graceUsedMonth is set to the PREVIOUS month,
#         which means the grace day is available again (not used this month).
#         Flow 56 tests grace used (current month); this tests the month-boundary
#         reset where grace becomes available again.
# Prerequisites: flow 02 (cold launch) + setup_wizard.
# clearState: false (flow 02 handles it)
appId: com.melnady.qadaa
---
- runFlow: ../flows/02_onboarding_skip.yaml
- runFlow: ../utils/setup_wizard.yaml
# Build the previous-month backup payload without inline JSON interpolation.
- runScript:
    file: ../utils/previous_month_payload.js
- tapOn:
    id: tab-settings
    retryTapIfNoChange: true
- waitForAnimationToEnd
- assertVisible:
    id: settings-screen
- scrollUntilVisible:
    element:
      id: settings-sync-btn
    direction: DOWN
- tapOn:
    id: settings-sync-btn
- waitForAnimationToEnd
- tapOn:
    id: sync-tab-import
- waitForAnimationToEnd
- tapOn:
    id: sync-paste-input
# graceUsedMonth = previous month → grace day should show as "available" this month.
- inputText: ${output.payload}
- swipe:
    start: 50%, 80%
    end: 50%, 20%
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: sync-import-btn
    timeout: 5000
- tapOn:
    id: sync-import-btn
- extendedWaitUntil:
    visible:
      id: sync-import-success
    timeout: 10000
- tapOn:
    id: sync-close-btn
    optional: true
- waitForAnimationToEnd
- swipe:
    start: 50%, 90%
    end: 50%, 10%
- waitForAnimationToEnd
- assertVisible:
    id: settings-screen
# Grace day badge should show "available" state (not "used").
- scrollUntilVisible:
    element:
      id: settings-grace-status
    direction: DOWN
- assertVisible:
    id: settings-grace-status
- copyTextFrom:
    id: settings-grace-status
- assertTrue: "${maestro.copiedText.includes('remaining')}"
