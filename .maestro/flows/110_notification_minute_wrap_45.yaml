# Flow: 110 - Notification Minute Wrap-Around at 45
# Suite: regression
# Covers: selecting minute 45 then saving; the picker should handle the 45-minute
#         option correctly and persist across remounts.
# Prerequisites: none (standalone — own launchApp with clearState + permission grant)
# clearState: true (cold start; do NOT runFlow 02 — it would double-launch)
appId: com.melnady.qadaa
---
- launchApp:
    clearState: true
    arguments:
      AppleLanguages: "(en)"
      AppleLocale: "en_UK"
    permissions:
      notifications: granted
- waitForAnimationToEnd
- assertVisible:
    id: onboarding-slide-1
- tapOn:
    id: onboarding-skip-btn
- waitForAnimationToEnd
- runFlow: ../utils/setup_wizard.yaml
- tapOn:
    id: tab-settings
    retryTapIfNoChange: true
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: settings-minute-45
    direction: DOWN
- tapOn:
    id: settings-minute-45
- waitForAnimationToEnd
- tapOn:
    id: notification-save-btn
- waitForAnimationToEnd
# Re-mount settings → minute 45 persists.
- tapOn:
    id: tab-dashboard
    retryTapIfNoChange: true
- waitForAnimationToEnd
- tapOn:
    id: tab-settings
    retryTapIfNoChange: true
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: settings-minute-45
    direction: DOWN
- assertVisible:
    id: settings-minute-45
    selected: true
