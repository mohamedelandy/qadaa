# Flow: 24 - Dashboard Hero Card
# Suite: regression
# Covers: hero card present before and after logging; streak badge stays visible;
#         target segment indicators render.
# Prerequisites: flow 02 (cold launch) + setup_wizard.
# clearState: false (flow 02 handles it)
appId: com.melnady.qadaa
---
- runFlow: ../flows/02_onboarding_skip.yaml
- runFlow: ../utils/setup_wizard.yaml
- assertVisible:
    id: dashboard-hero-card
- tapOn:
    id: dashboard-fajr-increment-btn
- waitForAnimationToEnd
- tapOn:
    id: dashboard-dhuhr-increment-btn
- waitForAnimationToEnd
- assertVisible:
    id: dashboard-hero-card
- assertVisible:
    id: dashboard-hero-segment
- scrollUntilVisible:
    element:
      id: dashboard-streak-count
    direction: UP
- assertVisible:
    id: dashboard-streak-count