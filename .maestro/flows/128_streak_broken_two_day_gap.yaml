# Flow: 128 - Streak Broken by Two-Day Gap
# Suite: regression
# Covers: importing a backup whose lastLogDate is TWO days ago AND graceUsedMonth
#         is the current month (grace already consumed). The streak logic's
#         "streak breaks to 1" path is exercised — the user had a streak but
#         missed 2 consecutive days with no grace day available.
#         Flow 74 tests at-risk (1-day gap); this tests the 2-day gap break.
# Prerequisites: flow 02 (cold launch) + setup_wizard.
# clearState: false (flow 02 handles it)
appId: com.melnady.qadaa
---
- runFlow: ../flows/02_onboarding_skip.yaml
- runFlow: ../utils/setup_wizard.yaml
# Build the two-day-gap payload with current local dates.
- runScript:
    file: ../utils/streak_break_payload.js
- tapOn:
    id: tab-settings
    retryTapIfNoChange: true
- waitForAnimationToEnd
- assertVisible:
    id: settings-screen
- scrollUntilVisible:
    element:
      id: settings-sync-btn
    direction: DOWN
- tapOn:
    id: settings-sync-btn
- waitForAnimationToEnd
- tapOn:
    id: sync-tab-import
- waitForAnimationToEnd
- tapOn:
    id: sync-paste-input
# Streak 5 with lastLogDate = 2 days ago AND graceUsedMonth = current month
# (grace already consumed this month) → streak breaks to 1.
- inputText: ${output.payload}
- swipe:
    start: 50%, 80%
    end: 50%, 20%
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: sync-import-btn
    timeout: 5000
- tapOn:
    id: sync-import-btn
- extendedWaitUntil:
    visible:
      id: sync-import-success
    timeout: 10000
- tapOn:
    id: sync-close-btn
    optional: true
- waitForAnimationToEnd
- swipe:
    start: 50%, 90%
    end: 50%, 10%
- waitForAnimationToEnd
- assertVisible:
    id: settings-screen
# Navigate to dashboard — streak should have broken (reset to 1 after today's log).

