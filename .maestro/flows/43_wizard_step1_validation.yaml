# Flow: 43 - Wizard Step 1 Validation
# Suite: regression
# Covers: puberty age >= age shows the step-1 validation error and keeps Next disabled;
#         fixing the input clears the error and advances to step 2.
# Prerequisites: flow 02 (cold launch). Do NOT runFlow setup_wizard — we drive the wizard.
# clearState: false (flow 02 handles it)
appId: com.melnady.qadaa
---
- runFlow: ../flows/02_onboarding_skip.yaml
- assertVisible:
    id: wizard-step1-screen
- tapOn:
    id: wizard-age-input
- eraseText
- inputText: "14"
- tapOn:
    id: wizard-puberty-input
- eraseText
- inputText: "14"
- tapOn:
    point: 50%, 15%
- waitForAnimationToEnd
# pubertyAge (14) >= age (14) → error visible, Next disabled (tap must not advance)
- assertVisible:
    id: wizard-step1-error
- assertVisible:
    id: wizard-step1-next-btn
    enabled: false
- tapOn:
    id: wizard-step1-next-btn
- waitForAnimationToEnd
- assertVisible:
    id: wizard-step1-screen
# Fix puberty age to 12 → error clears, Next advances to step 2
- tapOn:
    id: wizard-puberty-input
- eraseText
- inputText: "12"
- tapOn:
    point: 50%, 15%
- waitForAnimationToEnd
- assertNotVisible:
    id: wizard-step1-error
- tapOn:
    id: wizard-step1-next-btn
- waitForAnimationToEnd
- assertVisible:
    id: wizard-step2-screen
