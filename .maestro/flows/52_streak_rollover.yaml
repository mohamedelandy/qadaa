# Flow: 52 - Streak Rollover (Increment Across a Simulated Day)
# Suite: regression
# Covers: importing a backup whose lastLogDate is YESTERDAY (computed at run
#         time via runScript, matching the simulator's local date) with streak=3,
#         then logging today's first prayer must roll the streak over to 4.
#         (computeStreakState: lastLogDate === yesterday → streak + 1.)
# Prerequisites: flow 02 (cold launch) + setup_wizard.
# clearState: false (flow 02 handles it)
appId: com.melnady.qadaa
---
- runFlow: ../flows/02_onboarding_skip.yaml
- runFlow: ../utils/setup_wizard.yaml
# Build the streak backup payload (streak=3, lastLogDate=yesterday) via script
# to avoid a 600+ char inputText that crashes XCTest on iOS 26.5.
- runScript:
    file: ../utils/streak_payload.js
- tapOn:
    id: tab-settings
    retryTapIfNoChange: true
- waitForAnimationToEnd
- assertVisible:
    id: settings-screen
- scrollUntilVisible:
    element:
      id: settings-sync-btn
    direction: DOWN
- tapOn:
    id: settings-sync-btn
- waitForAnimationToEnd
- tapOn:
    id: sync-tab-import
- waitForAnimationToEnd
- tapOn:
    id: sync-paste-input
- inputText: ${output.payload}
# Swipe down to dismiss the keyboard, then tap the import button.
- swipe:
    start: 50%, 80%
    end: 50%, 20%
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: sync-import-btn
    timeout: 5000
- tapOn:
    id: sync-import-btn
- extendedWaitUntil:
    visible:
      id: sync-import-success
    timeout: 10000
- tapOn:
    id: sync-close-btn
    optional: true
- waitForAnimationToEnd
- swipe:
    start: 50%, 90%
    end: 50%, 10%
- waitForAnimationToEnd
- assertVisible:
    id: settings-screen
# Log today's first prayer → streak rolls 3 → 4
