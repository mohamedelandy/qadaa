# Flow: 100 - Onboarding Button Navigation
# Suite: regression
# Covers: navigating between onboarding slides using the Next button,
#         verifying each slide renders.
# Note: The onboarding screen has no swipe gesture support — navigation
#       is button-driven only (useState advanced by nextSlide).
# Prerequisites: none (fresh state via clearState)
# clearState: true (cold start must begin at onboarding)
appId: com.melnady.qadaa
---
- launchApp:
    clearState: true
    arguments:
      AppleLanguages: "(en)"
      AppleLocale: "en_UK"
- waitForAnimationToEnd
- assertVisible:
    id: onboarding-slide-1
# Tap Next to advance to slide 2.
- tapOn:
    id: onboarding-next-btn
- waitForAnimationToEnd
- assertVisible:
    id: onboarding-slide-2
# Tap Next to advance to slide 3.
- tapOn:
    id: onboarding-next-btn
- waitForAnimationToEnd
- assertVisible:
    id: onboarding-slide-3
# Tap Next to advance to slide 4.
- tapOn:
    id: onboarding-next-btn
- waitForAnimationToEnd
- assertVisible:
    id: onboarding-slide-4
# Tap Skip to return to the beginning (skip is only visible on non-last slides,
# so we need to be on slide 4 and it won't be visible — use Begin instead,
# but that finishes onboarding. Instead, relaunch to verify slide 1 again).
- launchApp:
    clearState: true
    arguments:
      AppleLanguages: "(en)"
      AppleLocale: "en_UK"
- waitForAnimationToEnd
- assertVisible:
    id: onboarding-slide-1
