# Flow: 67 - Notification Save Permission Denied
# Suite: regression
# Covers: saving a reminder time while notifications permission is DENIED shows
#         the denial error under the picker instead of saving — the third
#         permission state (unset = flow 16, granted = flows 53/60).
# Prerequisites: none (standalone — own launchApp with clearState + permission deny)
# clearState: true (cold start; do NOT runFlow 02 — it would double-launch)
appId: com.melnady.qadaa
---
- launchApp:
    clearState: true
    arguments:
      AppleLanguages: "(en)"
      AppleLocale: "en_UK"
    permissions:
      notifications: denied
- waitForAnimationToEnd
- assertVisible:
    id: onboarding-slide-1
- tapOn:
    id: onboarding-skip-btn
- waitForAnimationToEnd
- runFlow: ../utils/setup_wizard.yaml
- tapOn:
    id: tab-settings
    retryTapIfNoChange: true
- waitForAnimationToEnd
- assertVisible:
    id: settings-screen
- scrollUntilVisible:
    element:
      id: notification-save-btn
    direction: DOWN
- tapOn:
    id: notification-save-btn
- waitForAnimationToEnd
# Permission denied → denial error is shown, the picker survives.
- assertVisible:
    id: notification-error
- assertVisible:
    id: notification-hour-value
- assertVisible:
    id: settings-screen
