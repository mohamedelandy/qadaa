# Flow: 74 - Streak At-Risk State
# Suite: regression
# Covers: with a streak whose last log was YESTERDAY the dashboard streak pill
#         renders its at-risk variant; logging today's first prayer rolls the
#         streak over (3 → 4) and flips the pill back to the safe variant.
# Prerequisites: flow 02 (cold launch) + setup_wizard.
# clearState: false (flow 02 handles it)
appId: com.melnady.qadaa
---
- runFlow: ../flows/02_onboarding_skip.yaml
- runFlow: ../utils/setup_wizard.yaml
# Build the yesterday backup payload without inline JSON interpolation.
- runScript:
    file: ../utils/streak_at_risk_payload.js
- tapOn:
    id: tab-settings
    retryTapIfNoChange: true
- waitForAnimationToEnd
- assertVisible:
    id: settings-screen
- scrollUntilVisible:
    element:
      id: settings-sync-btn
    direction: DOWN
- tapOn:
    id: settings-sync-btn
- waitForAnimationToEnd
- tapOn:
    id: sync-tab-import
- waitForAnimationToEnd
- tapOn:
    id: sync-paste-input
# Streak 3 with lastLogDate = yesterday → at risk until today's first log.
- inputText: ${output.payload}
# Swipe down to dismiss the keyboard, then tap the import button.
- swipe:
    start: 50%, 80%
    end: 50%, 20%
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: sync-import-btn
    timeout: 5000
- tapOn:
    id: sync-import-btn
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: sync-import-success
    timeout: 10000
- tapOn:
    id: sync-close-btn
    optional: true
- waitForAnimationToEnd
- swipe:
    start: 50%, 90%
    end: 50%, 10%
- waitForAnimationToEnd
- assertVisible:
    id: settings-screen
# --- At-risk state: yesterday's last log, nothing today ---

