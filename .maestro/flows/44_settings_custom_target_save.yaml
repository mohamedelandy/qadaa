# Flow: 44 - Settings Custom Daily Target Save
# Suite: regression
# Covers: custom daily target (3) saved in settings persists — dashboard hero pill
#         reflects the new target (0/3) instead of the default (0/5).
# Prerequisites: flow 02 (cold launch) + setup_wizard (default target 5).
# clearState: false (flow 02 handles it)
appId: com.melnady.qadaa
---
- runFlow: ../flows/02_onboarding_skip.yaml
- runFlow: ../utils/setup_wizard.yaml
- tapOn:
    id: tab-settings
    retryTapIfNoChange: true
- waitForAnimationToEnd
- assertVisible:
    id: settings-screen
- scrollUntilVisible:
    element:
      id: settings-presets-grid
    direction: DOWN
- assertVisible:
    id: settings-presets-grid
- tapOn:
    id: settings-pace-custom-btn
- waitForAnimationToEnd
- assertVisible:
    id: settings-pace-custom-input
- tapOn:
    id: settings-pace-custom-input
- eraseText
- inputText: "3"
- tapOn:
    point: 50%, 15%
- waitForAnimationToEnd
- tapOn:
    id: settings-target-save-btn
    retryTapIfNoChange: true
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: settings-screen
    timeout: 10000
# Saved custom target persists to the dashboard hero pill (raw digits, locale-safe)
- tapOn:
    id: tab-dashboard
    retryTapIfNoChange: true
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: dashboard-screen
    timeout: 10000
- assertVisible: "0/3"
