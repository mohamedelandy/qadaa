# Flow: 98 - Wizard Step 3 Debug Screenshots
# Suite: regression
# Covers: screenshotting wizard step 3 before/after pace selection and after
#         advancing, then verifying step 4 renders (visual debug flow).
# Prerequisites: flow 02 (cold launch). Do NOT runFlow setup_wizard — we drive the wizard.
# clearState: false (flow 02 handles it)
appId: com.melnady.qadaa
---
- runFlow: ../flows/02_onboarding_skip.yaml
- assertVisible:
    id: wizard-step1-screen
- tapOn:
    id: wizard-age-input
- eraseText
- inputText: "28"
- tapOn:
    id: wizard-puberty-input
- eraseText
- inputText: "14"
- tapOn:
    point: 50%, 15%
- waitForAnimationToEnd
- tapOn:
    id: wizard-step1-next-btn
- waitForAnimationToEnd
- assertVisible:
    id: wizard-step2-screen
- tapOn:
    id: wizard-years-quick-input
- eraseText
- inputText: "5"
- tapOn:
    point: 50%, 15%
- waitForAnimationToEnd
- tapOn:
    id: wizard-step2-next-btn
- waitForAnimationToEnd
- assertVisible:
    id: wizard-step3-screen
- takeScreenshot: wizard-step3-before-pace
- tapOn:
    id: wizard-pace-5-btn
- waitForAnimationToEnd
- takeScreenshot: wizard-step3-after-pace
- tapOn:
    id: wizard-step3-next-btn
- waitForAnimationToEnd
- takeScreenshot: wizard-step3-after-next
- assertVisible:
    id: wizard-step4-screen
