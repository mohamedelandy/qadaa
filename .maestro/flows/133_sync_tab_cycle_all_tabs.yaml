# Flow: 133 - Sync Tab Cycle All Tabs
# Suite: regression
# Covers: cycling through all three sync section tabs (QR → Clipboard → Import
#         → QR) to verify state cleanup between tabs — no stale content leaks
#         across tab switches. Individual tabs are tested in flows 28/45/69 but
#         no single flow exercises the full cycle.
# Prerequisites: flow 02 (cold launch) + setup_wizard.
# clearState: false (flow 02 handles it)
appId: com.melnady.qadaa
---
- runFlow: ../flows/02_onboarding_skip.yaml
- runFlow: ../utils/setup_wizard.yaml
- tapOn:
    id: tab-settings
    retryTapIfNoChange: true
- waitForAnimationToEnd
- assertVisible:
    id: settings-screen
- scrollUntilVisible:
    element:
      id: settings-sync-btn
    direction: DOWN
- tapOn:
    id: settings-sync-btn
- waitForAnimationToEnd
# --- QR tab (default) ---
- assertVisible:
    id: sync-tab-qr
- assertVisible:
    id: sync-qr-container
# --- Switch to Clipboard tab ---
- tapOn:
    id: sync-tab-clipboard
- waitForAnimationToEnd
- assertVisible:
    id: sync-copy-btn
- assertVisible:
    id: sync-preview-json
# --- Switch to Import tab ---
- tapOn:
    id: sync-tab-import
- waitForAnimationToEnd
- assertVisible:
    id: sync-paste-input
- assertVisible:
    id: sync-import-btn
# --- Cycle back to QR tab ---
- tapOn:
    id: sync-tab-qr
- waitForAnimationToEnd
- assertVisible:
    id: sync-qr-container
# QR container is visible again — no stale clipboard/import content.
- assertNotVisible:
    id: sync-copy-btn
- tapOn:
    id: sync-close-btn
    optional: true
- waitForAnimationToEnd
- swipe:
    start: 50%, 90%
    end: 50%, 10%
- waitForAnimationToEnd
- assertVisible:
    id: settings-screen
