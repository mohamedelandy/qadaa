# Flow: 71 - Wizard Step 3 Custom Pace Validation
# Suite: regression
# Covers: the step-3 custom-pace input surfaces its validation error (required
#         when empty, 1–50 range when out of bounds) and keeps Next disabled
#         until a valid target is entered.
# Prerequisites: flow 02 (cold launch). Do NOT runFlow setup_wizard — we drive the wizard.
# clearState: false (flow 02 handles it)
appId: com.melnady.qadaa
---
- runFlow: ../flows/02_onboarding_skip.yaml
- assertVisible:
    id: wizard-step1-screen
- tapOn:
    id: wizard-age-input
- eraseText
- inputText: "28"
- tapOn:
    id: wizard-puberty-input
- eraseText
- inputText: "14"
- tapOn:
    point: 50%, 15%
- waitForAnimationToEnd
- tapOn:
    id: wizard-step1-next-btn
- waitForAnimationToEnd
- assertVisible:
    id: wizard-step2-screen
- tapOn:
    id: wizard-years-quick-input
- eraseText
- inputText: "5"
- tapOn:
    point: 50%, 15%
- waitForAnimationToEnd
- tapOn:
    id: wizard-step2-next-btn
- waitForAnimationToEnd
- assertVisible:
    id: wizard-step3-screen
# Custom mode with an empty value → "required" error, Next stays disabled.
- tapOn:
    id: wizard-pace-custom-btn
- waitForAnimationToEnd
- assertVisible:
    id: wizard-pace-custom-input
- tapOn:
    point: 50%, 15%
- waitForAnimationToEnd
- assertVisible:
    id: wizard-step3-error
- assertVisible:
    id: wizard-step3-next-btn
    enabled: false
- tapOn:
    id: wizard-step3-next-btn
- waitForAnimationToEnd
- assertVisible:
    id: wizard-step3-screen
# Out-of-range value (51 > 50) → "range" error, Next still disabled.
- tapOn:
    id: wizard-pace-custom-input
- inputText: "51"
- tapOn:
    point: 50%, 15%
- waitForAnimationToEnd
- assertVisible:
    id: wizard-step3-error
- assertVisible:
    id: wizard-step3-next-btn
    enabled: false
- tapOn:
    id: wizard-step3-next-btn
- waitForAnimationToEnd
- assertVisible:
    id: wizard-step3-screen
# A valid value clears the error and unlocks Next.
- tapOn:
    id: wizard-pace-custom-input
- eraseText
- inputText: "7"
- tapOn:
    point: 50%, 15%
- waitForAnimationToEnd
- assertNotVisible:
    id: wizard-step3-error
- tapOn:
    id: wizard-step3-next-btn
- waitForAnimationToEnd
- assertVisible:
    id: wizard-step4-screen
- tapOn:
    id: wizard-confirm-btn
# The intention sheet auto-confirms after ~4s — wait deterministically for the
# dashboard to mount, then for the sheet to close itself.
- extendedWaitUntil:
    visible:
      id: dashboard-screen
    timeout: 20000
- extendedWaitUntil:
    notVisible:
      id: intention-sheet
    timeout: 15000
- assertVisible:
    id: dashboard-screen
- assertVisible: "0/7"
