# Flow: 68 - Sync Import Invalid JSON
# Suite: regression
# Covers: pasting a non-JSON payload into the sync import tab shows the import
#         error and never the success state — the error path was untested (all
#         imports so far used valid payloads).
# Prerequisites: flow 02 (cold launch) + setup_wizard.
# clearState: false (flow 02 handles it)
appId: com.melnady.qadaa
---
- runFlow: ../flows/02_onboarding_skip.yaml
- runFlow: ../utils/setup_wizard.yaml
- tapOn:
    id: tab-settings
    retryTapIfNoChange: true
- waitForAnimationToEnd
- assertVisible:
    id: settings-screen
- scrollUntilVisible:
    element:
      id: settings-sync-btn
    direction: DOWN
- tapOn:
    id: settings-sync-btn
- waitForAnimationToEnd
- tapOn:
    id: sync-tab-import
- waitForAnimationToEnd
- tapOn:
    id: sync-paste-input
- inputText: "this is not valid json"
# The paste keyboard covers the import button. Tap the tab bar (above
# the keyboard) to dismiss it, then the button becomes reachable.
# Swipe down to dismiss the keyboard, then tap the import button.
- swipe:
    start: 50%, 80%
    end: 50%, 20%
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: sync-import-btn
    timeout: 5000
- tapOn:
    id: sync-import-btn
- waitForAnimationToEnd
# Invalid payload → error shown, success never shown, sheet stays open.
- assertVisible:
    id: sync-import-error
- assertNotVisible:
    id: sync-import-success
- tapOn:
    id: sync-close-btn
    optional: true
- waitForAnimationToEnd
- swipe:
    start: 50%, 90%
    end: 50%, 10%
- waitForAnimationToEnd
- assertVisible:
    id: settings-screen
