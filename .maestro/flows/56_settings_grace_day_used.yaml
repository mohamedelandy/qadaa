# Flow: 56 - Settings Grace Day Used
# Suite: regression
# Covers: importing a backup whose graceUsedMonth is the CURRENT month renders
#         the grace-day badge in its used state (status text = remaining zero).
#         Flow 27 covers the unused state; this is the used counterpart.
# Prerequisites: flow 02 (cold launch) + setup_wizard.
# clearState: false (flow 02 handles it)
appId: com.melnady.qadaa
---
- runFlow: ../flows/02_onboarding_skip.yaml
- runFlow: ../utils/setup_wizard.yaml
# Build the current-month backup payload without inline JSON interpolation.
- runScript:
    file: ../utils/grace_used_payload.js
- tapOn:
    id: tab-settings
    retryTapIfNoChange: true
- waitForAnimationToEnd
- assertVisible:
    id: settings-screen
- scrollUntilVisible:
    element:
      id: settings-sync-btn
    direction: DOWN
- tapOn:
    id: settings-sync-btn
- waitForAnimationToEnd
- tapOn:
    id: sync-tab-import
- waitForAnimationToEnd
- tapOn:
    id: sync-paste-input
- inputText: ${output.payload}
# Swipe down to dismiss the keyboard, then tap the import button.
- swipe:
    start: 50%, 80%
    end: 50%, 20%
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: sync-import-btn
    timeout: 5000
- tapOn:
    id: sync-import-btn
- extendedWaitUntil:
    visible:
      id: sync-import-success
    timeout: 10000
- tapOn:
    id: sync-close-btn
    optional: true
- waitForAnimationToEnd
- swipe:
    start: 50%, 90%
    end: 50%, 10%
- waitForAnimationToEnd
- assertVisible:
    id: settings-screen
- scrollUntilVisible:
    element:
      id: settings-grace-status
    direction: DOWN
- assertVisible:
    id: settings-grace-status
# Used state is represented by the rendered grace-status element.
- assertVisible:
    id: settings-grace-status
- swipe:
    start: 50%, 20%
    end: 50%, 90%
- waitForAnimationToEnd
# Dashboard counterpart: the streak pill shows the grace emoji while used.
- tapOn:
    id: tab-dashboard
    retryTapIfNoChange: true
- waitForAnimationToEnd
- assertVisible:
    id: dashboard-screen
- assertVisible: "🤲"
