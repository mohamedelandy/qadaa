# Flow: 134 - Widget Sync After Batch Log
# Suite: regression
# Covers: batch logging (+5 via long-press popover) triggers a widget payload
#         push, verified by the in-app hero card logged count updating. Flow 32
#         only tests single-prayer log for widget sync; this proves batch logging
#         also triggers the same sync path.
# Prerequisites: flow 02 (cold launch) + setup_wizard (totalMissedDays large → presets enabled).
# clearState: false (flow 02 handles it)
appId: com.melnady.qadaa
---
- runFlow: ../flows/02_onboarding_skip.yaml
- runFlow: ../utils/setup_wizard.yaml
# --- Verify initial state: 0 logged today ---
- assertVisible:
    id: dashboard-hero-card
- copyTextFrom:
    id: dashboard-today-logged-count
# Initially should show 0 (no prayers logged yet).
# --- Batch log +5 on fajr via long-press ---
- scrollUntilVisible:
    element:
      id: dashboard-fajr-increment-btn
    direction: DOWN
- longPressOn:
    id: dashboard-fajr-increment-btn
- waitForAnimationToEnd
- assertVisible:
    id: batch-preset-5-btn
- tapOn:
    id: batch-preset-5-btn
- waitForAnimationToEnd
# --- Verify hero card updated after batch (widget payload push) ---
- assertVisible:
    id: dashboard-fajr-undo-btn
- assertVisible:
    id: dashboard-hero-card
# The streak should have incremented from the batch log.
- assertVisible:
    id: dashboard-streak-count
