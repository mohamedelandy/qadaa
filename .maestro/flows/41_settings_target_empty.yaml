# Flow: 41 - Settings Daily Target Empty Save
# Suite: regression
# Covers: empty custom daily target save feedback
# Prerequisites: flow 02 (cold launch) + setup_wizard
# clearState: false (flow 02 handles it)
appId: com.melnady.qadaa
---
- runFlow: ../flows/02_onboarding_skip.yaml
- runFlow: ../utils/setup_wizard.yaml
- tapOn:
    id: tab-settings
    retryTapIfNoChange: true
- waitForAnimationToEnd
- assertVisible:
    id: settings-screen
- scrollUntilVisible:
    element:
      id: settings-presets-grid
    direction: DOWN
- assertVisible:
    id: settings-presets-grid
- tapOn:
    id: settings-pace-custom-btn
- waitForAnimationToEnd
- assertVisible:
    id: settings-pace-custom-input
- tapOn:
    id: settings-pace-custom-input
- eraseText
- tapOn:
    id: settings-target-save-btn
- waitForAnimationToEnd
- assertVisible:
    id: settings-target-save-btn